gallery23devnotes = "В ПРОЦЕССЕ"

gallery24name = "Indulgence"
gallery24 = "СОЗДАНО В СОТРУДНИЧЕСТВЕ С BANANANATER"
gallery24devnotes = "В ПРОЦЕССЕ"

gallery25name = "Uriel"
gallery25 = "Привет! Как здорово, что вы хотите узнать обо мне. Я Уриэль, один из 7 святых архангелов небесного двора Яхве. Я ученик доброты и мудрости. Не обращайте внимания на отсутствие у меня крыльев — я отдал их, чтобы стать земным писцом; я веками изучал каждое грядущее тысячелетие и те, что уже прошли. Это я вел вас всё это время! Рад видеть, что ваше любопытство так же велико, как и моё."
gallery25devnotes = "Все хотят трахнуть этого парня, я не понимаю."

gallery26name = ""
gallery26 = ""
gallery26devnotes = "В ПРОЦЕССЕ"


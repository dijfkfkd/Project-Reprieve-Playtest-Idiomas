spankbill = "Появляется SpankBill. Каждые два раза, когда вы закрываете камеры, SpankBill стоит в центральном коридоре, прежде чем убежать налево или направо. Ослепите их в камере 7, если они побежали налево, или в камере 6, если они побежали направо."
spankbill1 = "Spankbill остается абсолютно прежним."
spankbill2 = "Малыш Спэнки может появиться в вашем офисе, когда SpankBill убегает; если это произошло, ослепите камеру, в которой SpankBill НЕТ."

[gallery]
gallery0name = "Whim"
gallery0 = "Whim — один из старейших демонов Ада, чье существование восходит к первому прямому акту гнева, совершенному живыми. Несмотря на свой возраст, она невероятно предана делу развращения мира своим гневом, в частности через акты мести. Она фанатеет от подобного рода вещей. В последнее время она стала гораздо раздражительнее из-за того, что кто-то выбил ей зубы. Интересно, с чего бы это."
gallery0devnotes = "Зачем я только сделал ей жирную задницу. Whim была САМЫМ первым персонажем Project Reprieve, которого создали. Её арт, звуковые эффекты и код были сделаны раньше, чем у любого другого персонажа или механики. Очевидно, она основана на вашем стандартном дизайне дьявола: рога, острые зубы и красный цвет. У неё должен был быть хвост, но от этой идеи отказались еще до написания первой версии Project Reprieve."

gallery1name = "N"
gallery1 = "Чудовищное создание насилия и ярости. Манифестация ужасных военных действий, придуманных живыми. Когда N впервые появилась на свет примерно в 1930-х годах, она проложила путь из северного региона России по всему европейскому континенту, спустившись в Ад в 1960-х и оставляя за собой шлейф из жутких смертей и страданий. N не способна к рассуждениям, так как всё её существование — это сплошное страдание. Её тело едва держится вместе благодаря силе воли и стежкам, пока она ведет внутреннюю войну у себя внутри. Говорят, что если N расколоть надвое, миру придет конец."
gallery1devnotes = "В ПРОЦЕССЕ"

gallery2name = "2any"
gallery2 = "Зенатия была частью живых, точно так же, как и вы. Однако её снедали ревность и зависть, которые привели её по пути самобичевания и горькой обиды на любого, кого она считала «лучше». Когда она умерла, её приговорили в Аду к заключению в металлическом теле и заставили смотреть на тех, кто в верхнем мире проживает жизни, которые она сама могла бы прожить, будь она лучше. Тем не менее, как ни странно, при виде вас внутри неё вскипела внутренняя ярость, сгнившая её сердце и душу до тех пор, пока не остались лишь зависть и ярость ко всем, кто стремится к самосовершенствованию. Её здесь быть не должно, но каждый раз, когда мы возвращаем её в её Ад, она сбегает, оставляя после себя еще больше мертвых демонов."
gallery2devnotes = "В ПРОЦЕССЕ"

gallery3name = "Wanton"
gallery3 = "Вы когда-нибудь задумывались, что это за голосок на задворках вашего разума, призывающий поддаться самонаслаждению? Скорее всего, это Wanton вытворяет свои штучки с вами. Манифестация нечестной похоти и угодничества перед самим собой. Wanton имеют тенденцию действовать в одиночку и оставлять большие промежутки между собой для выполнения своей работы. Территориальные споры между секторами Ада, доминируемыми Wanton, всегда представляют собой неловкое зрелище. Wanton также склонны склонять вас к злоупотреблению наркотиками или другим порокам."
gallery3devnotes = "В ПРОЦЕССЕ"

gallery4name = "Pompous"
gallery4 = "Pompous с момента своего создания был избалованным демоном жадности. Он провел свои формирующие годы, потребляя драгоценные металлы, в основном золото, поедая их в таких количествах, что его кожа сгнила, оставив на её месте лишь блестящий скелет. Голод Pompous так никогда по-настоящему и не насытился. Один из коллег-демонов Pompous был одним из первых учеников жадности, внедривших идею капитализма. Однако Pompous осквернил того демона до такой степени, что задался целью вытравить его имя из учебников истории, лишь бы заявить, что эта идея принадлежала ему."
gallery4devnotes = "В ПРОЦЕССЕ"

gallery5name = "creep"
gallery5 = "Всегда помните о своих взглядах, ведь они — инструмент для познания мира и принятия решений, а не то, кем вы являетесь. Вам не следует противиться их отбрасыванию, если они не работают. Но creep, аберрация гордыни, следит за тем, чтобы люди цеплялись за свои мнения сильнее, чем за своих живых ближних. Запирая их менталитет железными прутьями и страхом. Чувствуете этот ужас за спиной? Это creep ведет наблюдение. Настаивая на том, чтобы вы были последовательны в своих взглядах. Будьте осторожны, если передумаете, так как у creep есть привычка заставлять тех, кто это делает, обратить внимание на их перемену... насильно."
gallery5devnotes = "В ПРОЦЕССЕ"

gallery6name = "RANCOR"
gallery6 = "О, бедная несчастная душа грешницы. Снедаемая презрением к себе худшим, чем то, что мог бы изречь даже язык Дьявола. Несмотря на моё сочувствие, Яхве рассудил, что судьбой этой грешницы станет утрата всей её идентичности. Крики пронзали небо, пока её душу бичевали. Оставленная блуждать по окраинам Ада, не имея даже лица, чтобы выплакать собственное горе. Проявите к ней доброту, если сможете."
gallery6devnotes = "В ПРОЦЕССЕ"

gallery7name = "StitchWork"
gallery7 = "Я ненавижу StitchWork. Она лгунья и мошенница, а её гордыне нет предела. Несмотря на то, что она является манифестацией лжи и обмана, она на удивление самосознательна. Не в такой степени, как демоны, ангелы или живые, но тем не менее удивительно. StitchWork впервые посеяла семена недоверия еще в древние времена и с тех пор запутывает общение живых. Возможно, поэтому у неё гораздо больше осознанности по сравнению с другими манифестациями. В любом случае, не верьте ничему из того, что кто-либо говорит рядом с ней."
gallery7devnotes = "В ПРОЦЕССЕ"

gallery8name = "CONCEIT"
gallery8 = "CONCEIT — это насмешливая аберрация, движимая гордыней. Она считает себя лучше вас, меня и даже Яхве. Мне еще не доводилось видеть, чтобы кто-то нашел способ заставить её отступить от этой позиции, так как она склонна быстро заканчивать такое противостояние. И летально. Проводить время в её компании — это хождение по канату над пропастью высвобождения её эго. Лучше не будить зверя. Но будьте осторожны, если вдруг почувствуете себя превосходящим и совершенным. Никто не совершенен. Существование CONCEIT источает резкий запах незаслуженной гордости у всех вокруг. Будьте осторожны."
gallery8devnotes = "В ПРОЦЕССЕ"

gallery9name = "Qualm"
gallery9 = "Сотканная из сожалений и прикованная к прошлому. Движимая завистью Qualm — интересная манифестация. Её зависть вызвана не ревностью к другим, а завистью к прошлому и желанием вернуть его таким же прекрасным, каким оно было раньше. Qualm грызет душу изнутри наружу, медленно источая мысли о сомнении и самосаботаже в бедные души, которые она берет на мушку. Со временем они стагнируют. Прикованные точно так же, как прикована Qualm. Возможно, она ученица зависти потому, что завидует свободе других."
gallery9devnotes = "В ПРОЦЕССЕ"

gallery10name = "Reap"
gallery10 = "Несмотря на то, что может показаться по её внешности, Reap — ангел, находящийся здесь, чтобы помочь вам. Не каким-то масштабным образом, а просто напоминая не скатываться в лень. Он более... прямолинейен, чем большинство других ангелов, из-за чего его и назначили в Ад. К сожалению, это означало, что ему пришлось отказаться от своей ангельской формы, так как долгое пребывание в Аду постепенно разрушило бы столь чувствительное к греху тело, как у ангела. Поэтому он принял эту более простую и дружелюбную форму. Reap мог бы делать всё, что захочет, но, полагаю, они смирились с этим. Возможно, вы могли бы спросить его об этом."
gallery10devnotes = "В ПРОЦЕССЕ"

gallery11name = "Caustic"
gallery11 = "Прагматизм. Слово, незнакомое большинству, но идеально описывающее Caustic. Возникающие из чистой моральной декомпозиции лени. Делать правильные вещи только тогда, когда это легко, а не тогда, когда это правильно. Caustic нацеливаются на людей со слабой волей или проблемами исполнительной функции и просачивают мысли об эгоизме и равнодушии в их сердца. Срезанные пути могут быть полезны, но остерегайтесь злоупотребления ими. Caustic оставляют после себя разбитые семьи и разрушают отношения, спускаясь в Ад после проявления."
gallery11devnotes = "В ПРОЦЕССЕ"

gallery12name = "BLACKENed"
gallery12 = "Помощь друга всегда приветствуется, и нужно знать, когда она необходима. Тем не менее, чрезмерная зависимость от других ведет человека к лени. BLACKENed — душа с прогнившим сердцем. Она продолжала полагаться на других и зависеть от них, несмотря на каждую возможность сделать всё самостоятельно. Несмотря на то, что была прекрасно способна сделать всё сама. И всё равно всегда просила о помощи или перекладывала свои обязанности на других. Она вынуждена истекать кровью, не имея возможности остановить это самостоятельно, в то время как боль нарастает по мере того, как её едкая кровь сжигает её каменную кожу. Она может лишь наблюдать, как вся её голова тонет в кислотных отходах. Как печально."
gallery12devnotes = "В ПРОЦЕССЕ"

gallery13name = "INTENT"
gallery13 = "Насмешка. Аберрация похоти, созданная Им. INTENT маскируется под ангела изо всех сил, но маска эта несовершенна. Его нимб сломан, а крыльев нет. INTENT — это поклонение, доведенное до неподобающего уровня. Всё его существование посвящено навязыванию своего извращенного чувства морали и преданности другим. Под одеждами скрываются десятки вырезанных имен Яхве на самых разных языках. Ни в коем случае нельзя слушать проповеди INTENT; это донельзя неразумное и набожное существо, вплоть до морального краха, поскольку его убеждения меняются в мгновение ока на то, что он считает Словом Её."
gallery13devnotes = "В ПРОЦЕССЕ"

gallery14name = "Shelter"
gallery14 = "Shelter — демон гордыни, сформированный из стыда. Её страх перед осуждением настолько глубок, что блокирует любое возможное осуждение или критику. Она — один из немногих демонов, способных самостоятельно создавать манифестации, которыми являются множественные рты, используемые ею для нашептывания чувств ужаса и тревоги тем, на кого она нацелена. Эти рты — существа, отделенные от самой Shelter, но они подчиняются каждому ее приказу. Без своих ртов рядом Shelter смертельно боится кого угодно и чего угодно."
gallery14devnotes = "В ПРОЦЕССЕ"

gallery15name = "OverGrowth"
gallery15 = "Рожденная от давней родительской небрежности, OverGrowth — манифестация, оставившая после себя шлейф из гниения и осквернения, которая до сих пор не спустилась в Ад полностью. Истинное тело OverGrowth простирается на тысячи миль; большая его часть находится в Аду, но части её до сих пор ползают по поверхности мира живых, оставляя за собой сгнившие здания и голодных домашних животных. Что любопытно, OverGrowth — первая и пока единственная манифестация, состоящая из растительной материи, а не созданная из демонических энергий. Тело OverGrowth по-прежнему контролируется демоническими силами, но мне интересно, является ли всё её тело одним титаническим существом или несколькими крупными существами, управляющими разными частями."
gallery15devnotes = "В ПРОЦЕССЕ"

gallery16name = "GRUDGE"
gallery16 = "GRUDGE — аберрация ярости и насилия. Она выслеживает тех, кто борется или одинок ночью, и сбивает их с ног. Её нападение продолжается до тех пор, пока жертва не оказывается на волосок от смерти, после чего она шепчет ей на уши ужасные мысли о насилии и ускользает в ночь. Странно то, что если жертва соглашается, её глубокие раны и порезы быстро заживают. Но если жертва достаточно чиста или морально сильна, чтобы не поддаться, раны остаются глубокими и кровоточат. Немногие выживали после отказа ей."
gallery16devnotes = "В ПРОЦЕССЕ"

gallery17name = "Grovel"
gallery17 = "Grovel — хиральный аналог BLACKENed. Вместо того чтобы быть чрезмерно зависимым, он был слишком независимым в одиночку, до такой степени, что голодал, остался без крыши над головой и в конечном итоге умер от инфекции в ране на ногах. Глубоко устыдившись, попав в Ад, он сбежал на окраины, прячась в шкурах местной фауны и рыская по угодьям в поисках всего, что могло бы помочь ему искупить вину перед самим собой."
gallery17devnotes = "В ПРОЦЕССЕ"

gallery18name = "Waste"
gallery18 = "Гнилая аберрация обжорства. Waste питается отбросами, мусором и загрязнением, создаваемыми живыми; в настоящее время основная масса её тела обитает в Тихом океане и занимает площадь около 620 000 квадратных миль. В настоящее время Waste медленно просачивается из Ада обратно в мир живых, чтобы продолжить питаться. Она часто проникает в источники воды и пищевые цепи, заражая их своей сущностью и подталкивая потребителей к еще большему мусоросвязыванию, потреблению и созданию всё большего количества отходов."
gallery18devnotes = "В ПРОЦЕССЕ"

gallery19name = "glare"
gallery19 = "Разве вы не знаете, что пялиться — это грубо? А уж так пристально тем более. Оставьте меня в покое. Пожалуйста. Всё, что нужно сказать, чтобы вы ушли, я скажу. Пожалуйста, не делайте мне больно."
gallery19devnotes = "В ПРОЦЕССЕ"


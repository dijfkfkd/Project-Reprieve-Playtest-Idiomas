[modifiers]
whim = "La Irascible Whim aparece. Se mueve a través de las cámaras, atacando tu oficina. Golpéala en la CARA cuando aparezca."
whim1 = "Tienes menos tiempo para lidiar con Whim."
whim2 = "Después de golpear a Whim, debes ir a la cámara 1 y destellarla."
whim3 = "Whim te da más tiempo para destellarla y golpearla, pero se mueve a través de las cámaras mucho más rápido."
n = "La Irascible N aparece. Se mueve a través de las cámaras, atacando tu oficina. Lánzale una roca a SU CABEZA cuando aparezca."
n1 = "N requiere una roca adicional para hacerla marchar."
n2 = "Cuando N se marche, forzará un ataque de StitchWork."
n3 = "Tienes menos tiempo para lidiar con N, y se mueve más rápido por las cámaras."
twoany = "La Envidiosa 2any aparece. Se mueve por las cámaras, atacando tu puerta. Ciérrale la puerta en la cara cuando se presente."
twoany1 = "Debes mantener la puerta cerrada con fuerza sobre 2any durante un segundo completo."
twoany2 = "2any volverá a atacar rápidamente después de su primer ataque, con un temporizador de muerte más corto, pero se irá inmediatamente SIEMPRE al cerrar la puerta."
twoany3 = "2any llega mucho más rápido."
wanton = "La Lujuriosa Wanton aparece. Se mueve a través de las cámaras, atacando tu oficina. Mueve tu cursor verticalmente y con rapidez sobre ella hasta que se vaya."
wanton1 = "Wanton requiere mucho más movimiento de agitación hacia arriba y hacia abajo para irse (o te da menos tiempo para golpearla si 'sentir algo' está activo)."
wanton2 = "Ahora hay que golpear a Wanton. Espera a que el pecho de Wanton se abra con forma de corazón."
wanton3 = "El ataque de Wanton tiene 2 fases. Primero haz la agitación con el ratón, lo cual abrirá el corazón de Wanton."
pompous = "La Avariciosa Pompous aparece. Se mueve por las cámaras, atacando tu oficina. Contén la respiración mientras mantienes el cursor sobre ella."
pompous1 = "Pompous se desvanecerá lentamente después de aparecer."
pompous2 = "Pompous robará tu pistola o roca si las tienes en la mano y pasas el cursor sobre ella. Cada objeto que robe reduce el tiempo que debes aguantar la respiración."
pompous3 = "El tiempo que tienes para lidiar con Pompous se reduce, y debes contener la respiración sobre ella por más tiempo."
creep = "La Orgullosa creep aparece. Está en la cámara 7. Usa el flash de la cámara para restablecer su movimiento."
creep1 = "Cuanto más pases sin mirar la cámara de creep, más rápido avanzará. Hasta 3 veces más rápido."
creep2 = "creep ya no se reinicia al recibir el flash. creep solo retrocederá una etapa."
creep3 = "Destellar a creep acelera un poco la infección de glare."
rancor = "La Irascible RANCOR aparece. Se manifiesta en la cámara 7 o 6. Aparecerá a la izquierda o derecha de tu oficina. Golpéala."
rancor1 = "RANCOR ahora ataca 4 veces seguidas."
rancor2 = "RANCOR se mueve más lento, pero debe ser destellada en su cámara antes de que entre a la oficina."
rancor3 = "Tienes menos tiempo para lidiar con RANCOR."
stitchwork = "La Orgullosa StitchWork aparece. Si ves una alucinación de StitchWork en tu pantalla, encuentra la cámara marcada de marrón y destellala."
stitchwork1 = "La alucinación de StitchWork se desvanecerá lentamente después de atacar."
stitchwork2 = "StitchWork requiere 2 destellos y se moverá después de cada uno."
stitchwork3 = "StitchWork tiene versiones falsas de sí misma en todas las cámaras en las que NO está."
conceit = "La Orgullosa CONCEIT aparece. A veces aparecerá en la oficina; contén la respiración cuando abra su ojo."
conceit1 = "Golpear a CONCEIT ahora solo restablecerá su ataque."
conceit2 = "Debes contener la respiración ANTES de que CONCEIT abra la boca."
conceit3 = "CONCEIT ataca más rápido."
qualm = "La Envidiosa Qualm aparece. A veces aparecerá en la oficina, dispárale 3 veces. Se moverá cada vez que le disparen."
qualm1 = "Qualm ahora se moverá constantemente."
qualm2 = "Tienes menos tiempo para lidiar con Qualm."
qualm3 = "Tienes mucho menos tiempo para lidiar con Qualm."
reap = "El Indolente Reap aparece. Seguirá tu cursor, siendo más lento cuanto más cerca esté de él. Mantener el cursor sobre él durante mucho tiempo te matará."
reap1 = "Reap se mueve un poco más rápido y gira de forma más cerrada."
reap2 = "Golpear a Reap forzará un ataque de Qualm, Caustic y CONCEIT. Reap no se podrá golpear si alguno de esos 3 está activo."
reap3 = "El tiempo que has tocado a Reap volverá lentamente a 0 en lugar de restablecerse a 0 al dejar de pasar el cursor sobre ella."
caustic = "La Indolente Caustic aparece. Una señal de advertencia parpadeará en la oficina. Una vez que termine de parpadear, lánzale una roca."
caustic1 = "Caustic solo parpadea con su advertencia dos veces y mata mucho más rápido."
caustic2 = "Caustic se mueve ocasionalmente mientras ataca."
caustic3 = "Caustic hace que BLACKENed se desangre más rápido cuando está atacando."
blackened = "La Indolente BLACKENed estará de pie en tu pasillo, sangrando lentamente. Haz clic en ella para contener la hemorragia."
blackened1 = "BLACKENed se desangra más rápido."
blackened2 = "La señal de sonido de BLACKENed está silenciada."
blackened3 = "Cuanto más se haya desangrado BLACKENed, más oscura se pondrá la oficina."

intent = "El Lujurioso INTENT aparece. Tiene un número en su ''halo'', contará hasta 7; asegúrate de estar en las cámaras cuando lo alcance."
intent1 = "El número de INTENT ahora estará entre 7 y 10."
intent2 = "INTENT se aparece más a menudo."
shelter = "La Orgullosa Shelter aparece. Se mueve a través de las cámaras, atacando tu oficina. Dispara a las 3 bocas que convoca alrededor de la oficina y luego dispárale a ella."
shelter1 = "Shelter convocará 5 bocas en lugar de 3."
shelter2 = "Shelter se mueve más rápido por las cámaras."
overgrowth = "La Indolente OverGrowth aparece. Cuando la cabeza de flor de OverGrowth asome a la oficina, encuentra sus 3 enredaderas en las 3 cámaras marcadas de rosa y destella dicha cámara."
overgrowth1 = "Las enredaderas de OverGrowth invadirán tu espacio más rápido."
overgrowth2 = "OverGrowth ahora ataca a todas las cámaras pero tarda mucho más en matar."
grudge = "La Irascible GRUDGE aparece. GRUDGE comenzará ocasionalmente a moverse por tu oficina. Golpéala hasta romperle todos los dientes. Si llega al otro lado de la oficina, te matará."
grudge1 = "A GRUDGE le volverán a crecer los dientes si no se lidia con ella con la suficiente rapidez."
grudge2 = "GRUDGE correrá más rápido cuanto menos progreso haya hecho."
grovel = "El Envidioso Grovel aparece. Recuerda qué símbolo tiene Grovel en el cartel que sostiene. Ya que cada vez que guarde su cartel, necesitarás usar el método correcto para defenderte de ellos. (Mantén el cursor sobre él si necesitas contener la respiración)."
grovel1 = "Grovel dejará caer su cartel cada 3 caídas de cámara, dándote menos tiempo para lidiar con él."
grovel2 = "Grovel se moverá por ahí después de soltar su cartel."
waste = "La Gula de Waste aparece. Waste se filtrará en la oficina en diferentes lugares como un pequeño glóbulo. Golpea los pequeños glóbulos cuando les crezca un ojo. Si se acumulan 5 glóbulos con ojos, Waste te matará."
waste1 = "Los glóbulos de Waste harán crecer ojos más rápido después de filtrarse en tu oficina."
waste2 = "Todos los glóbulos de Waste se acumularán lentamente, uno más rápido que los demás, y solo a ese le crecerá un ojo antes que a los otros."
glare = "La Envidiosa glare aparece. glare infectará lentamente las cámaras una por una. Si infecta todas tus cámaras, te matará. Destellar una cámara la limpia."
glare1 = "Una cámara completamente infectada por glare solo limpiará la infección al recibir el flash, y requerirá un segundo flash para lidiar con cualquier otra persona."
glare2 = "La cantidad de cámaras que glare haya infectado aumentará la velocidad de creep."

flood = "La Glotona FlOOD aparece. Cuando escuches el sonido de agua corriendo, cierra la puerta rápidamente para detenerla."
flood1 = "FlOOD embiste tu puerta más rápido."
flood2 = "FlOOD atacará 3 veces seguidas."
maw = "La Avariciosa Maw aparece. Se manifestará en tu oficina a veces; dispárale cuando su boca esté abierta. Dispararle cuando está cerrada no hace nada."
maw1 = "Maw se mueve por ahí, más aún cuando su boca está abierta."
maw2 = "Maw cierra la boca con mayor frecuencia."
crave = "La Glotona CRAVE aparece. Se moverá a través de las cámaras maullando. En su cuarto maullido, cierra la puerta para bloquearla."
crave1 = "CRAVE debe ser destellada antes de que llegue a la puerta."
crave2 = "CRAVE ahora ataca en su cuarto O tercer maullido."

adhere = "La Lujuriosa Adhere aparece. Adhere a veces aparecerá en el centro de tu oficina. Golpéala dos veces para hacerla marchar."

gallery24devnotes = "PENDIENTE"

gallery25name = "Uriel"
gallery25 = "¡Hola! Qué bueno que quieras saber sobre mí. Soy Uriel, uno de los 7 arcángeles sagrados de la corte celestial de Yahvé. Soy el discípulo de la bondad y la sabiduría. Ignora mi falta de alas, ya que las entregué para convertirme en un escriba terrenal; pasé siglos estudiando cada milenio por venir y aquellos que ya han pasado. ¡He sido yo quien te ha estado guiando todo este tiempo! Me alegra ver que tu curiosidad es tan buena como la mía."
gallery25devnotes = "Todo el mundo quiere follar con este tipo, no lo entiendo."

gallery26name = ""
gallery26 = ""
gallery26devnotes = "PENDIENTE"



[gallery]
gallery0name = "Whim"
gallery0 = "Whim es uno de los demonios más antiguos del Infierno, con una existencia que se remonta al primer acto directo de ira cometido por los vivos. A pesar de su edad, sigue estando increíblemente dedicada a corromper al mundo con su enojo, específicamente en actos de venganza. Le chifla esa clase de cosas. Recientemente ha estado mucho más irritable debido a que alguien le voló los dientes. Me pregunto de qué se tratará eso."
gallery0devnotes = "Por qué le habré puesto un culo gordo. Whim fue EL primer personaje de Project Reprieve en ser creado. Su arte, efectos de sonido y código se hicieron antes que los de cualquier otro personaje o mecánica. Obviamente está basada en tu diseño genérico de diablo: cuernos, dientes afilados y color rojo. Iba a tener cola, pero esa idea fue descartada antes de que se codificara la primera versión de Project Reprieve."

gallery1name = "N"
gallery1 = "Un espantoso constructo de violencia e ira. Una manifestación de los horribles actos bélicos que los vivos han acuñado. Cuando N nació en el mundo por primera vez, aproximadamente en la década de 1930, abrió camino desde la región norte de Rusia a lo largo y ancho del continente europeo, descendiendo al Infierno en la década de 1960 y dejando a su paso una estela de muerte y sufrimiento horribles. N es incapaz de razonar, ya que toda su existencia es sufrimiento. Su cuerpo se mantiene unido precariamente mediante fuerza de voluntad y puntadas mientras liberta una guerra interna en su interior. Algunos dicen que si N se partiera en dos, el mundo se acabaría."
gallery1devnotes = "PENDIENTE"

gallery2name = "2any"
gallery2 = "Zenatia formaba parte de los vivos, muy al igual que tú. Sin embargo, estaba plagada de celos y envidia, lo que la condujo por un camino de autodesprecio y amargo resentimiento hacia cualquiera a quien considerara 'mejor'. Cuando murió, fue condenada en el Infierno a quedar encerrada en un cuerpo metálico y obligada a ver a aquellos en el mundo superior llevar vidas que ella misma habría podido tener si hubiera sido mejor. No obstante, extrañamente, al verte a ti, una rabia interna hirvió en su interior, pudriendo su corazón y su alma hasta que lo único que quedó fue envidia y furia hacia todos los que buscan la superación. Se supone que no debería estar aquí, pero cada vez que la devolvemos a su Infierno, se escapa, dejando más demonios muertos a su paso."
gallery2devnotes = "PENDIENTE"

gallery3name = "Wanton"
gallery3 = "Alguna vez te has preguntado qué es esa vocecita en el fondo de tu cabeza que te dice que cedas al auto-placer? Lo más probable es que sea una Wanton haciendo de las suyas contigo. Una manifestación de la lujuria deshonesta y el servilismo hacia uno mismo. Las Wantons tienden a ir en solitario y dejarse grandes espacios de separación para hacer su trabajo. Las disputas territoriales entre las secciones del Infierno dominadas por Wantons son siempre un espectáculo incómodo. Las Wantons también son propicias para tentarte hacia el abuso de drogas u otros vicios."
gallery3devnotes = "PENDIENTE"

gallery4name = "Pompous"
gallery4 = "Pompous ha sido un demonio de la avaricia malcriado desde su creación. Pasó sus años formativos consumiendo metales preciosos, principalmente oro, comiendo tanto que su piel se pudrió hasta dejar en su lugar únicamente su brillante esqueleto. El hambre de Pompous jamás se ha saciado de verdad. Uno de los colegas demonios de Pompous fue uno de los primeros discípulos de la avaricia en introducir la idea del capitalismo. Sin embargo, Pompous profanó a ese demonio hasta el punto de empeñarse en borrar su nombre de los libros de historia, solo para poder decir que la idea había sido suya."
gallery4devnotes = "PENDIENTE"

gallery5name = "creep"
gallery5 = "Ten siempre presentes tus opiniones, ya que son una herramienta para ver el mundo y tomar decisiones, no lo que eres. No deberías oponerte a descartarlas si no sirven. Pero creep, una aberración del orgullo, se asegura de que la gente aferre sus opiniones con más fuerza que a sus semejantes vivos. Enjaulando sus mentalidades con barrotes de hierro y miedo. ¿Sientes esa pavor a tus espaldas? Esa es creep vigilando. Insistiendo en que seas coherente con tus puntos de vista. Ten cuidado si cambias de opinión, ya que creep tiene la costumbre de hacer que quienes lo hacen presten atención a su cambio... a la fuerza."
gallery5devnotes = "PENDIENTE"

gallery6name = "RANCOR"
gallery6 = "Oh, pobre alma infeliz de pecadora. Plagada de un desprecio propio peor que el que incluso la lengua del Diablo podría propinar. A pesar de mi simpatía, Yahvé juzgó que el destino de esta pecadora sería la pérdida de toda su identidad. Los gritos atravesaron el cielo mientras su alma era azotada. Dejada para deambular por las afueras del Infierno, sin tan solo un rostro con el cual llorar por sí misma. Muéstrale bondad si pudieras."
gallery6devnotes = "PENDIENTE"

gallery7name = "StitchWork"
gallery7 = "Odio a StitchWork. Es una mentirosa y una tramposa, y su orgullo no conoce límites. A pesar de ser una manifestación de la mentira y el engaño, es sorprendentemente consciente de sí misma. No tanto como los demonios, los ángeles o los vivos, pero resulta sorprendente aun así. StitchWork sembró por primera vez las semillas de la desconfianza desde los tiempos de la antigüedad, y ha enredado la comunicación de los vivos desde entonces. Quizás por eso tiene mucha más conciencia en comparación con otras manifestaciones. De cualquier modo, no confíes en nada de lo que nadie diga a su alrededor."
gallery7devnotes = "PENDIENTE"

gallery8name = "CONCEIT"
gallery8 = "CONCEIT es una burla de aberración impulsada por el orgullo. Se considera mejor que tú, que yo y que incluso Yahvé. Todavía tengo que ver a alguien encontrar la manera de hacer que recule en esa postura, ya que tiende a terminar ese enfrentamiento rápidamente. Y de forma letal. Pasar tiempo en su compañía es caminar por la cuerda floja de desatar su ego. Es mejor no despertar a la bestia. Pero ten cuidado si llegas a sentirte superior y perfecto. Nadie es perfecto. La existencia de CONCEIT exuda un olor acre de orgullo inmerecido en quienes la rodean. Ten cuidado."
gallery8devnotes = "PENDIENTE"

gallery9name = "Qualm"
gallery9 = "Hecha de arrepentimientos y encadenada al pasado. La Qualm impulsada por la envidia es una manifestación interesante. Su envidia está impulsada no por celos hacia los demás, sino hacia el pasado, y por el deseo de hacer que vuelva a ser tan bueno como antes. Qualm pudre el alma desde adentro hacia afuera, goteando lentamente pensamientos de duda y autosabotaje en las pobres almas que toma por objetivo. Con el tiempo se estancan. Encadenadas de la misma manera que lo está Qualm. Tal vez sea discípula de la envidia porque está celosa de la libertad de los demás."
gallery9devnotes = "PENDIENTE"

gallery10name = "Reap"
gallery10 = "A pesar de lo que su apariencia podría sugerir, Reap es un ángel que está aquí para ayudarte. No de ninguna forma importante, sino simplemente para recordarte que no caigas en la pereza. Es más... contundente que la mayoría de los otros ángeles, de ahí que lo hayan asignado al Infierno. Desgraciadamente, esto significó que tuvo que desprenderse de su forma angélica, ya que sus estancias prolongadas en el Infierno corroerían lentamente un cuerpo tan sensible al pecado como el de un ángel. Así que adoptó esta forma más sencilla y amistosa. Reap podría hacer lo que quisiera, pero supongo que se han conformado con esto. Tal vez podrías preguntarle."
gallery10devnotes = "PENDIENTE"

gallery11name = "Caustic"
gallery11 = "Pragmatismo. Una palabra desconocida para la mayoría, pero que encaja a la perfección con las Caustic. Manifestadas a partir de la pura descomposición moral de la pereza. Hacer lo correcto únicamente si resulta fácil en lugar de si es lo correcto. Las Caustic apuntan a aquellos con voluntades débiles o problemas de función ejecutiva, y filtran pensamientos de egoísmo e indiferencia en sus corazones. Los atajos pueden ser útiles, pero ten cuidado de no abusar de ellos. Las Caustic dejan familias rotas y destruyen relaciones al descender al Infierno tras manifestarse."
gallery11devnotes = "PENDIENTE"

gallery12name = "BLACKENed"
gallery12 = "La ayuda de un amigo siempre se agradece, y uno debe saber cuándo la necesita. Sin embargo, depender demasiado de los demás conducirá a uno hacia la pereza. BLACKENed es un alma con el corazón podrido. Siguió confiando y dependiendo de los demás, a pesar de cada oportunidad que tuvo de hacer las cosas por sí misma. A pesar de ser perfectamente capaz de hacer las cosas por sí misma. Y aun así siempre pedía una mano, o se dedicaba a endilgar sus responsabilidades a los demás. Se ve obligada a desangrarse, incapaz de detenerlo por su cuenta, mientras el dolor se acumula a medida que su sangre corrosiva quema su piel de piedra. Tan solo puede ver cuando toda su cabeza se ahoga en el desecho ácido. Qué triste."
gallery12devnotes = "PENDIENTE"

gallery13name = "INTENT"
gallery13 = "Una burla. Una aberración de la lujuria hecha por Él. INTENT se disfraza lo mejor que puede de ángel, pero su disfraz es defectuoso. Su halo está roto y carece de alas. INTENT es adoración llevada a niveles inapropiados. Toda su existencia está dedicada a imponer su sentido retorcido de la moralidad y la devoción sobre los demás. Bajo las túnicas, hay docenas de grabados del nombre de Yahvé, todos escritos en diferentes idiomas. Nunca se deben escuchar los sermones de INTENT; es un ser irrazonablemente piadoso, hasta el punto de estar arruinado moralmente, ya que sus creencias cambian en un abrir y cerrar de ojos hacia lo que sea que crea que es la palabra de Ella."
gallery13devnotes = "PENDIENTE"

gallery14name = "Shelter"
gallery14 = "Shelter es un demonio del orgullo, formado a partir de la vergüenza. Su miedo al juicio es tan profundo que bloquea cualquier posible juicio o crítica. Es uno de los pocos demonios capaces de crear manifestaciones por sí misma, las cuales son las múltiples bocas que utiliza para susurrar sentimientos de pavor y ansiedad a aquellos a los que apunta. Estas bocas son seres separados de la propia Shelter, pero obedecen todas sus órdenes. Sin sus bocas a su lado, Shelter le teme mortalmente a cualquiera y a cualquier cosa."
gallery14devnotes = "PENDIENTE"

gallery15name = "OverGrowth"
gallery15 = "Nacida de la negligencia de un padre hace mucho tiempo, OverGrowth es una manifestación que dejó una estela de podredumbre y profanación, y todavía no ha descendido por completo al Infierno. El verdadero cuerpo de OverGrowth tiene miles de millas de largo; la mayor parte se encuentra en el Infierno, pero partes de ella aún se arrastran por la superficie del mundo de los vivos, dejando edificios podridos y mascotas hambrientas. Curiosamente, OverGrowth es la primera y hasta ahora única manifestación hecha de materia vegetal en lugar de una forma manifestada a partir de energías demoníacas. El cuerpo de OverGrowth sigue estando controlado por fuerzas demoníacas, pero me pregunto si su cuerpo entero es un ser titánico o varios seres grandes controlando diferentes partes."
gallery15devnotes = "PENDIENTE"

gallery16name = "GRUDGE"
gallery16 = "GRUDGE es una aberración de la ira y la violencia. Apunta a aquellos que luchan o están solos por la noche y los derriba al suelo. Su asalto continúa hasta que la víctima está a un pelo de morir, y entonces le susurra pensamientos horribles de violencia a los oídos y se escabulle en la noche. Lo extraño es que, si la víctima acepta, sus profundas heridas y tajos sanan rápidamente. Pero si la víctima es lo suficientemente pura o fuerte moralmente como para no ceder, las heridas permanecen profundas y sangran. Pocos han sobrevivido jamás tras rechazarla."
gallery16devnotes = "PENDIENTE"

gallery17name = "Grovel"
gallery17 = "Grovel es la contraparte quiral de BLACKENed. En lugar de ser demasiado dependiente, era demasiado independiente por cuenta propia, hasta el punto de morirse de hambre, quedarse sin hogar y culminar eventualmente muriendo a causa de una infección en una herida de sus piernas. Profundamente avergonzado, cuando llegó al Infierno huyó hacia las afueras, ocultándose en la piel de la fauna local, acechando los terrenos en busca de cualquier cosa que pudiera hacer para redimirse ante sus propios ojos."
gallery17devnotes = "PENDIENTE"

gallery18name = "Waste"
gallery18 = "Una podrida aberración de la gula. Waste se sustenta de los desperdicios, la basura y la contaminación creada por los vivos; actualmente su masa corporal principal reside en el océano Pacífico y mide aproximadamente 620,000 millas cuadradas de tamaño. Waste se está filtrando lentamente en la actualidad desde el Infierno hacia el mundo de los vivos para volver a alimentarse. A menudo se filtra en los suministros de agua y en las cadenas alimentarias, corrompiéndolas con su esencia e incitando a los consumidores a ensuciar más, consumir más y, en general, crear cada vez más residuos."
gallery18devnotes = "PENDIENTE"

gallery19name = "glare"
gallery19 = "¿No sabes que es grosero quedarse mirando? Y más aún con tanta fijeza. Déjame en paz. Por favor. Lo que sea que tenga que decir para que te vayas, lo diré. No me hagas daño, por favor."
gallery19devnotes = "PENDIENTE"


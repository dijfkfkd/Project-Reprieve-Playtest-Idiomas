capital1 = ""
capital2 = ""
hog = "A luxuriosa HOG aparece. Ela às vezes cai no escritório; puxe-a para baixo para jogá-la para fora com um elástico."
hog1 = ""
hog2 = ""
hive = "A preguiçosa Hive aparece. A Hive tem um relógio-cronômetro correndo no escritório. Periodicamente, a Hive gera um Sofrimento em uma das câmeras. Essa câmera está marcada em vermelho. Vá para essa câmera e dê um flash nela. Não deixe a Hive gerar mais de 3 Sofrimentos ao mesmo tempo."
hive1 = ""
hive2 = ""
monument = "Os orgulhosos Monument e Trier aparecem. O Monument vai choramingar alto; verifique a câmera 4 para saber qual Trier eles estão pedindo. Encontre esse Trier em uma das câmeras e clique nele."
monument1 = ""
monument2 = ""
analog = "O Analógico aparece. O Analógico está na câmera 2 com um cronômetro. Quando o cronômetro acabar, o Analógico ataca; acerte-o rapidamente."
analog1 = "O cronômetro do Analógico tem menos tempo, e você tem menos tempo para lidar com ele."
analog2 = "O Analógico pode aparecer em qualquer ponto horizontal do escritório."
travis = "O Travis aparece. O Travis ataca sua porta, mas após bloqueá-la, encontre-o na câmera 7 ou 6 e dê um flash nele."
travis1 = "Travis pode se mover para qualquer câmera do mapa após sair da porta."
travis2 = "Floyd e Lucas estarão nas câmeras onde o Travis NÃO está. Dar um flash neles reduz o cronômetro de morte do Travis."
silverroachy = "O SilverRoachy aparece. Dê um flash no SilverRoachy na câmera 1 para reiniciá-lo. Se ele avançar totalmente, ele desativará suas câmeras pelo resto do round."
silverroachy1 = "O SilverRoachy vai se mover para outra câmera após cada flash. Essa câmera estará marcada em verde."
silverroachy2 = "O SilverRoachy só pode ser cegado quando estiver branco."
themass = "A The Mass aparece. A The Mass vai subir lentamente, preenchendo seu escritório; prenda a respiração para se limpar dela."
themass1 = "A The Mass sobe mais rápido."
themass2 = "A The Mass sobe mais devagar, mas se ela subir até a metade da sua morte, esse será o limite máximo para o qual ela pode ser empurrada de volta."
spankbill = "O SpankBill aparece. A cada duas vezes que você fecha as câmeras, o SpankBill fica no corredor central antes de correr para a esquerda ou direita. Dê um flash neles na câmera 7 se correrem para a esquerda, ou na câmera 6 se correrem para a direita."
spankbill1 = "O Spankbill continua exatamente o mesmo."
spankbill2 = "O pequeno Spanky pode aparecer no seu escritório quando o SpankBill estiver fugindo; se isso acontecer, dê um flash na câmera em que o SpankBill NÃO está."

[gallery]
gallery0name = "Whim"
gallery0 = "Whim é um dos demônios mais antigos do Inferno, cuja existência remonta ao primeiro ato direto de ira cometido pelos vivos. Apesar de sua idade, ela é incrivelmente dedicada a corromper o mundo com sua raiva, particularmente através de atos de vingança. Ela é viciada nesse tipo de coisa. Ultimamente, ela ficou muito mais irritada porque alguém arrancou os dentes dela. Pergunto-me o porquê."
gallery0devnotes = "Por que diabos eu fui dar uma bunda grande para ela. A Whim foi a PRIMEIRA personagem do Project Reprieve a ser criada. Sua arte, efeitos sonoros e código foram feitos antes de qualquer outro personagem ou mecânica. Obviamente, ela é baseada no design padrão de diabo: chifres, dentes afiados e cor vermelha. Ela deveria ter uma cauda, mas essa ideia foi descartada antes mesmo de escrever a primeira versão do Project Reprieve."

gallery1name = "N"
gallery1 = "Uma criação monstruosa de violência e fúria. A manifestação de terríveis atos de guerra inventados pelos vivos. Quando a N surgiu pela primeira vez por volta da década de 1930, ela abriu caminho desde a região norte da Rússia por todo o continente europeu, descendo ao Inferno na década de 1960 e deixando um rastro de mortes horríveis e sofrimento. A N é incapaz de raciocinar, pois toda a sua existência é puro sofrimento. Seu corpo mal se mantém unido graças à força de vontade e pontos enquanto ela trava uma guerra interna dentro de si. Dizem que se a N for dividida ao meio, o mundo chegará ao fim."
gallery1devnotes = "EM DESENVOLVIMENTO"

gallery2name = "2any"
gallery2 = "Zenatia fazia parte dos vivos, exatamente como você. No entanto, ela era consumida pelo ciúme e pela inveja, o que a levou por um caminho de autoflagelação e rancor amargo contra qualquer um que ela considerasse 'melhor'. Quando morreu, foi condenada no Inferno a ser presa em um corpo de metal e forçada a assistir àqueles que, no mundo superior, levam vidas que ela mesma poderia ter vivido se fosse melhor. No entanto, curiosamente, ao ver você por dentro, uma fúria interna ferveu, apodrecendo seu coração e alma até que restassem apenas inveja e raiva de todos que buscam a autoaperfeiçoamento. Ela não deveria estar aqui, mas toda vez que a devolvemos ao seu Inferno, ela foge, deixando para trás ainda mais demônios mortos."
gallery2devnotes = "EM DESENVOLVIMENTO"

gallery3name = "Wanton"
gallery3 = "Você já se perguntou que voz é essa no fundo da sua mente, te chamando para ceder ao autoprazer? É muito provável que seja a Wanton fazendo suas artimanhas com você. A manifestação da luxúria desonesta e da bajulação de si mesmo. As Wantons tendem a agir sozinhas e a deixar grandes intervalos entre si para realizar seu trabalho. Disputas territoriais entre setores do Inferno dominados pela Wanton são sempre um espetáculo constrangedor. As Wantons também tendem a te induzir ao abuso de drogas ou outros vícios."
gallery3devnotes = "EM DESENVOLVIMENTO"

gallery4name = "Pompous"
gallery4 = "Pompous tem sido um demônio mimado da ganância desde a sua criação. Ele passou seus anos de formação consumindo metais preciosos, principalmente ouro, comendo-os em quantidades tais que sua pele apodreceu, deixando em seu lugar apenas um esqueleto brilhante. A fome de Pompous nunca foi verdadeiramente saciada. Um dos colegas demônios de Pompous foi um dos primeiros discípulos da ganância a introduzir a ideia do capitalismo. No entanto, Pompous corrompeu tanto aquele demônio que fez questão de apagar seu nome dos livros de história apenas para reivindicar que a ideia era dele."
gallery4devnotes = "EM DESENVOLVIMENTO"

gallery5name = "creep"
gallery5 = "Lembre-se sempre de suas opiniões, pois elas são ferramentas para entender o mundo e tomar decisões, e não o que você é. Você não deve resistir a descartá-las se não estiverem funcionando. Mas a creep, uma aberração do orgulho, garante que as pessoas se apeguen às suas opiniões com mais força do que aos seus semelhantes vivos. Trancando a mentalidade deles com barras de ferro e medo. Consegue sentir esse pavor atrás de suas costas? É a creep fazendo a vigilância. Insistindo para que você seja consistente em seus pontos de vista. Tenha cuidado se mudar de ideia, pois a creep tem o hábito de fazer aqueles que o fazem prestar atenção na mudança deles... à força."
gallery5devnotes = "EM DESENVOLVIMENTO"

gallery6name = "RANCOR"
gallery6 = "Oh, pobre e infeliz alma de pecadora. Consumida pelo desprezo por si mesma pior do que até mesmo a língua do Diabo poderia proferir. Apesar da minha compaixão, Javé julgou que o destino desta pecadora seria a perda de toda a sua identidade. Gritos perfuraram o céu enquanto sua alma era açoitada. Deixada para vagar pelas periferias do Inferno, sem sequer um rosto para chorar o próprio luto. Mostre bondade a ela, se puder."
gallery6devnotes = "EM DESENVOLVIMENTO"

gallery7name = "StitchWork"
gallery7 = "Eu odeio a StitchWork. Ela é uma mentirosa e uma vigarista, e seu orgulho não tem limites. Apesar de ser a manifestação da mentira e do engano, ela é surpreendentemente autoconsciente. Não no mesmo nível dos demônios, anjos ou vivos, mas surpreendentemente consciente mesmo assim. A StitchWork semeou as primeiras sementes da desconfiança nos tempos antigos e tem confundido a comunicação dos vivos desde então. Talvez seja por isso que ela tem muito mais consciência em comparação com outras manifestações. De qualquer forma, não acredite em nada do que alguém disser perto dela."
gallery7devnotes = "EM DESENVOLVIMENTO"

gallery8name = "CONCEIT"
gallery8 = "CONCEIT é uma aberração zombeteira movida pelo orgulho. Ela se acha melhor do que você, do que eu e até mesmo do que Javé. Ainda não tive a oportunidade de ver alguém encontrar uma maneira de fazê-la recuar dessa posição, pois ela tende a terminar esse confronto rapidamente. E de forma letal. Passar tempo na companhia dela é caminhar na corda bamba sobre o abismo de liberar o ego dela. É melhor não cutucar a fera. Mas tome cuidado se de repente você se sentir superior e perfeito. Ninguém é perfeito. A existência da CONCEIT exala um cheiro forte de orgulho undeserved em todos ao redor. Tenha cuidado."
gallery8devnotes = "EM DESENVOLVIMENTO"

gallery9name = "Qualm"
gallery9 = "Tecida de arrependimentos e acorrentada ao passado. Movida pela inveja, a Qualm é uma manifestação interessante. A inveja dela não é motivada pelo ciúme dos outros, mas sim pela inveja do passado e pelo desejo de trazê-lo de volta tão belo quanto era antes. A Qualm rói a alma de dentro para fora, destilando lentamente pensamentos de dúvida e autossabotagem nas pobres almas que ela toma como alvo. Com o tempo, elas estagnam. Acorrentadas exatamente do mesmo jeito que a Qualm está acorrentada. Talvez ela seja discípula da inveja porque inveja a liberdade dos outros."
gallery9devnotes = "EM DESENVOLVIMENTO"

gallery10name = "Reap"
gallery10 = "Apesar do que possa parecer pela sua aparência, o Reap é um anjo que está aqui para te ajudar. Não de forma grandiosa, mas apenas lembrando-o para não cair na preguiça. Ele é mais... direto do que a maioria dos outros anjos, razão pela qual foi designado para o Inferno. Infelizmente, isso significava que ele teve que abrir mão de sua forma angelical, já que uma estadia prolongada no Inferno destruiria gradualmente um corpo tão sensível ao pecado quanto o de um anjo. Portanto, ele adotou essa forma mais simples e amigável. O Reap poderia fazer o que quisesse, mas acho que eles se acostumaram com isso. Talvez você pudesse perguntar a ele sobre isso."
gallery10devnotes = "EM DESENVOLVIMENTO"

gallery11name = "Caustic"
gallery11 = "Pragmatismo. Uma palavra desconhecida para a maioria, mas que descreve perfeitamente a Caustic. Nascidas da pura decomposição moral da preguiça. Fazer a coisa certa apenas quando é fácil, e não quando é o correto. As Caustics visam pessoas com vontade fraca ou problemas de função executiva e infiltram pensamentos de egoísmo e apatia em seus corações. Atalhos podem ser úteis, mas cuidado com o abuso deles. A Caustic deixa famílias destruídas e relacionamentos arruinados para trás ao descer ao Inferno após a manifestação."
gallery11devnotes = "EM DESENVOLVIMENTO"

gallery12name = "BLACKENed"
gallery12 = "A ajuda de um amigo é sempre bem-vinda, e é preciso saber quando ela é necessária. No entanto, a dependência excessiva dos outros leva o homem à preguiça. A BLACKENed é uma alma com um coração apodrecido. Ela continuou confiando nos outros e dependendo deles, apesar de ter tido todas as oportunidades de fazer tudo sozinha. Mesmo sendo perfeitamente capaz de fazer tudo por si mesma. E ainda assim, sempre pedia ajuda ou transferia suas responsabilidades para os outros. Ela é forçada a sangrar, sem conseguir parar isso sozinha, enquanto a dor aumenta à medida que seu sangue corrosivo queima sua pele de pedra. Ela só pode assistir enquanto toda a sua cabeça afunda em resíduos ácidos. Que triste."
gallery12devnotes = "EM DESENVOLVIMENTO"

gallery13name = "INTENT"
gallery13 = "Uma zombaria. Uma aberração da luxúria criada por Ele. O INTENT se disfarça de anjo com todas as forças, mas essa máscara é imperfeita. Sua auréola está quebrada e ele não tem asas. O INTENT é a adoração levada a um nível impróprio. Toda a sua existência é dedicada a impor seu senso distorcido de moralidade e devoção aos outros. Sob as vestes, escondem-se dezenas de nomes de Javé esculpidos nos mais variados idiomas. Sob nenhuma hipótese se deve ouvir os sermões do INTENT; é uma criatura extremamente irracional e devota, a ponto de sofrer colapso moral, já que suas crenças mudam em um piscar de olhos para o que ele considera ser a Palavra Dela."
gallery13devnotes = "EM DESENVOLVIMENTO"

gallery14name = "Shelter"
gallery14 = "Shelter é um demônio do orgulho formado a partir da vergonha. Seu medo do julgamento é tão profundo que bloqueia qualquer julgamento ou crítica possível. Ela é um dos poucos demônios capazes de criar autonomamente manifestações, que são as múltiplas bocas usadas por ela para sussurrar sentimentos de pavor e ansiedade àqueles que ela toma como alvo. Essas bocas são criaturas separadas da própria Shelter, mas obedecem a cada ordem dela. Sem suas bocas por perto, a Shelter tem um medo mortal de qualquer um e de qualquer coisa."
gallery14devnotes = "EM DESENVOLVIMENTO"

gallery15name = "OverGrowth"
gallery15 = "Nascida de uma negligência parental de longa data, a OverGrowth é uma manifestação que deixou um rastro de podridão e profanação que ainda não desceu completamente ao Inferno. O verdadeiro corpo da OverGrowth se estende por milhares de quilômetros; a maior parte está no Inferno, mas partes dela ainda rastejam pela superfície do mundo dos vivos, deixando edifícios apodrecidos e animais de estimação famintos em seu rastro. Curiosamente, a OverGrowth é a primeira e até agora única manifestação composta de matéria vegetal, em vez de ser criada a partir de energias demoníacas. O corpo da OverGrowth ainda é controlado por forças demoníacas, mas me pergunto se todo o seu corpo é uma criatura titânica ou várias criaturas grandes controlando partes diferentes."
gallery15devnotes = "EM DESENVOLVIMENTO"

gallery16name = "GRUDGE"
gallery16 = "GRUDGE é uma aberração de fúria e violência. Ela rastreia aqueles que lutam ou estão sozinhos à noite e os derruba. Seu ataque continua até que a vítima esteja à beira da morte, momento em que ela sussurra em seus ouvidos pensamentos horríveis de violência e escapa na noite. O estranho é que se a vítima concorda, seus ferimentos profundos e cortes saram rapidamente. Mas se a vítima for pura o suficiente ou moralmente forte para não ceder, os ferimentos permanecem profundos e sangram. Poucos sobreviveram após recusá-la."
gallery16devnotes = "EM DESENVOLVIMENTO"

gallery17name = "Grovel"
gallery17 = "Grovel é o equivalente quiral da BLACKENed. Em vez de ser excessivamente dependente, ele era independente demais sozinho, a ponto de passar fome, ficar sem teto e acabar morrendo de infecção em uma ferida nas pernas. Profundamente envergonhado ao chegar ao Inferno, ele fugiu para as periferias, escondendo-se com peles da fauna local e vasculhando as terras em busca de qualquer coisa que pudesse ajudá-lo a se redimir consigo mesmo."
gallery17devnotes = "EM DESENVOLVIMENTO"

gallery18name = "Waste"
gallery18 = "Uma aberração podre da gula. O Waste se alimenta de detritos, lixo e poluição gerados pelos vivos; atualmente, a maior parte de seu corpo habita o Oceano Pacífico e cobre uma área de cerca de 620.000 milhas quadradas. Atualmente, o Waste está vazando lentamente do Inferno de volta para o mundo dos vivos para continuar se alimentando. Ele frequentemente penetra em fontes de água e cadeias alimentares, infectando-as com sua essência e empurrando os consumidores a acumular ainda mais lixo, consumir e criar ainda mais resíduos."
gallery18devnotes = "EM DESENVOLVIMENTO"

gallery19name = "glare"
gallery19 = "Você não sabe que ficar encarando é maldade? E com tanta intensidade ainda por cima. Me deixe em paz. Por favor. Tudo o que for preciso dizer para você ir embora, eu direi. Por favor, não me machuque."
gallery19devnotes = "EM DESENVOLVIMENTO"


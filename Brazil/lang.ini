gallery23name = "Adhere"
gallery23 = "CRIADO EM COLABORAÇÃO COM VINNYGRAVE"
gallery23devnotes = "EM DESENVOLVIMENTO"

gallery24name = "Indulgence"
gallery24 = "CRIADO EM COLABORAÇÃO COM BANANANATER"
gallery24devnotes = "EM DESENVOLVIMENTO"

gallery25name = "Uriel"
gallery25 = "Olá! É ótimo que você queira saber sobre mim. Eu sou Uriel, um dos 7 arcanjos sagrados da corte celestial de Javé. Eu sou o discípulo da bondade e da sabedoria. Não ligue para a minha falta de asas — eu as descartei para me tornar um escriba terreno; passei séculos estudando cada milênio vindouro e aqueles que já se passaram. Fui eu quem guiou você esse tempo todo! Fico feliz em ver que sua curiosidade é tão grande quanto a minha."
gallery25devnotes = "Todo mundo quer transar com esse cara, eu não entendo."

gallery26name = ""
gallery26 = ""
gallery26devnotes = "EM DESENVOLVIMENTO"


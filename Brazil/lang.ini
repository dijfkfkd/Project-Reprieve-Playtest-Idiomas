[modifiers]
whim = "A irada Whim aparece. Ela se move pelas câmeras, atacando seu escritório. Acerte-a na CARA quando ela aparecer."
whim1 = "Você tem menos tempo para lidar com a Whim."
whim2 = "Depois de acertar a Whim, você deve ir para a câmera 1 e dar um flash nela."
whim3 = "A Whim te dá mais tempo para o flash e o soco, mas se move pelas câmeras muito mais rápido."
n = "A irada N aparece. Ela se move pelas câmeras, atacando seu escritório. Jogue uma pedra NA CABEÇA DELA quando ela aparecer."
n1 = "A N exige uma pedra extra para fazê-la recuar."
n2 = "Quando a N recua, isso provoca um ataque da StitchWork."
n3 = "Você tem menos tempo para lidar com a N, e ela se move pelas câmeras mais rápido."
twoany = "A invejosa 2any aparece. Ela se move pelas câmeras, atacando sua porta. Feche a porta na cara dela quando ela aparecer."
twoany1 = "Você deve segurar a porta firmemente fechada na frente da 2any por um segundo inteiro."
twoany2 = "A 2any ataca rapidamente de novo após seu primeiro ataque com um cronômetro de morte mais curto, mas sai SEMPRE imediatamente ao fechar a porta."
twoany3 = "A 2any chega muito mais rápido."
wanton = "A luxuriosa Wanton aparece. Ela se move pelas câmeras, atacando seu escritório. Mova o cursor rapidamente para cima e para baixo sobre ela até que ela vá embora."
wanton1 = "A Wanton exige muito mais movimentos de agitação para cima e para baixo para ir embora (ou dá menos tempo para o soco se 'sentir alguma coisa' estiver ativo)."
wanton2 = "Agora a Wanton precisa ser atingida. Espere o peito da Wanton abrir em forma de coração."
wanton3 = "O ataque da Wanton tem 2 fases. Primeiro faça a agitação com o mouse, o que abrirá o coração da Wanton."
pompous = "A gananciosa Pompous aparece. Ela se move pelas câmeras, atacando seu escritório. Prenda a respiração mantendo o cursor sobre ela."
pompous1 = "A Pompous vai se dissolver lentamente após aparecer."
pompous2 = "A Pompous vai roubar sua arma ou pedra se você estiver segurando-as e passar o cursor sobre ela. Cada item roubado reduz o tempo que você precisa prender a respiração."
pompous3 = "O tempo para lidar com a Pompous é reduzido e você precisa prender a respiração sobre ela por mais tempo."
creep = "A orgulhosa creep aparece. Ela está na câmera 7. Use o flash da câmera para redefinir o movimento dela."
creep1 = "Quanto mais tempo você passa sem olhar para a câmera da creep, mais rápido ela avança. Até 3 vezes mais rápido."
creep2 = "A creep não é mais redefinida pelo flash. A creep apenas recua um estágio."
creep3 = "O flash na creep acelera um pouco a infecção do glare."
rancor = "A irada RANCOR aparece. Ela se manifesta na câmera 7 ou 6. Ela aparecerá à esquerda ou à direita do seu escritório. Acerte-a."
rancor1 = "A RANCOR agora ataca 4 vezes seguidas."
rancor2 = "A RANCOR se move mais devagar, mas precisa ser cegada na câmera antes de entrar no escritório."
rancor3 = "Você tem menos tempo para lidar com a RANCOR."
stitchwork = "A orgulhosa StitchWork aparece. Se você vir a alucinação da StitchWork na sua tela, encontre a câmera marcada em marrom e dê um flash nela."
stitchwork1 = "A alucinação da StitchWork vai se dissolver lentamente após o ataque."
stitchwork2 = "A StitchWork exige 2 flashes e vai se mover após cada um."
stitchwork3 = "A StitchWork tem versões falsas de si mesma em todas as câmeras em que ela NÃO está."
conceit = "A orgulhosa CONCEIT aparece. Às vezes ela aparece no escritório; prenda a respiração quando ela abrir o olho."
conceit1 = "Acertar a CONCEIT agora apenas reinicia o ataque dela."
conceit2 = "Você deve prender a respiração ANTES que a CONCEIT abra a boca."
conceit3 = "A CONCEIT ataca mais rápido."
qualm = "A invejosa Qualm aparece. Às vezes ela aparece no escritório, atire nela 3 vezes. Ela vai se mover a cada tiro."
qualm1 = "A Qualm agora se move constantemente."
qualm2 = "Você tem menos tempo para lidar com a Qualm."
qualm3 = "Você tem muito menos tempo para lidar com a Qualm."
reap = "O preguiçoso Reap aparece. Ele seguirá o seu cursor, ficando mais devagar quanto mais perto estiver dele. Manter o cursor nele por muito tempo vai te matar."
reap1 = "O Reap se move um pouco mais rápido e faz curvas mais fechadas."
reap2 = "Acertar o Reap provocará um ataque de Qualm, Caustic e CONCEIT. O Reap não pode ser atingido se qualquer um desses três estiver ativo."
reap3 = "O tempo de toque do Reap voltará lentamente para 0 em vez de reiniciar para 0 ao afastar o cursor."
caustic = "A preguiçosa Caustic aparece. Um sinal de aviso piscará no escritório. Assim que ele parar de piscar, jogue uma pedra nela."
caustic1 = "A Caustic pisca o aviso apenas duas vezes e mata muito mais rápido."
caustic2 = "A Caustic se move ocasionalmente durante o ataque."
caustic3 = "A Caustic faz o BLACKENed sangrar mais rápido durante o ataque."
blackened = "A preguiçosa BLACKENed ficará no seu corredor, sangrando devagar. Clique nela para estancar o sangramento."
blackened1 = "A BLACKENed sangra mais rápido."
blackened2 = "O sinal sonoro da BLACKENed está desativado."
blackened3 = "Quanto mais a BLACKENed sangra, mais escuro o escritório fica."

intent = "O lustroso INTENT aparece. Ele tem um número em sua 'auréola', ele vai contar até 7; certifique-se de estar nas câmeras quando ele chegar lá."
intent1 = "O número do INTENT agora será de 7 a 10."
intent2 = "O INTENT aparece com mais frequência."
shelter = "A orgulhosa Shelter aparece. Ela se move pelas câmeras, atacando seu escritório. Atire nas 3 bocas que ela convoca ao redor do escritório e depois atire nela."
shelter1 = "A Shelter convocará 5 bocas em vez de 3."
shelter2 = "A Shelter se move mais rápido pelas câmeras."
overgrowth = "A preguiçosa OverGrowth aparece. Quando a flor da OverGrowth olhar para o escritório, encontre suas 3 vinhas nas 3 câmeras marcadas em rosa e dê um flash nessa câmera."
overgrowth1 = "As vinhas da OverGrowth tomarão seu espaço mais rápido."
overgrowth2 = "A OverGrowth agora ataca todas as câmeras, mas demora muito mais para matar."
grudge = "A irada GRUDGE aparece. A GRUDGE periodicamente começa a se mover pelo seu escritório. Acerte-a até arrancar todos os dentes dela. Se ela chegar ao outro lado do escritório, ela te mata."
grudge1 = "A GRUDGE criará dentes de novo se você não lidar com ela rápido o suficiente."
grudge2 = "A GRUDGE corre mais rápido quanto menos progresso ela tiver feito."
grovel = "O invejoso Grovel aparece. Lembre-se do símbolo na placa que o Grovel está segurando. Toda vez que ele abaixar a placa, você precisará usar o método correto de defesa contra ele (segure o cursor sobre ele se precisar prender a respiração)."
grovel1 = "O Grovel abaixará a placa a cada 3 trocas de câmera, dando menos tempo para lidar com ele."
grovel2 = "O Grovel vai se mover depois de abaixar a placa."
waste = "O guloso Waste aparece. O Waste vai vazar para o escritório em vários lugares como uma pequena gota. Acerte as pequenas gotas quando elas criarem um olho. Se acumularem 5 gotas com olhos, o Waste te mata."
waste1 = "As gotas do Waste vão criar olhos mais rápido depois de vazarem para o seu escritório."
waste2 = "Todas as gotas do Waste vão se acumular lentamente, uma mais rápido que as outras, e apenas ela criará um olho antes das outras."
glare = "A invejosa glare aparece. A glare vai infectar gradualmente as câmeras uma a uma. Se ela infectar todas as suas câmeras, ela te mata. Um flash na câmera a limpa."
glare1 = "Uma câmera totalmente infectada pela glare só se limpará da infecção no segundo flash, sendo o primeiro necessário para lidar com qualquer outra pessoa."
glare2 = "A quantidade de câmeras infectadas pela glare aumenta a velocidade da creep."

flood = "A gulosa FlOOD aparece. Quando ouvir o som de água correndo, feche a porta rapidamente para detê-la."
flood1 = "A FlOOD ataca sua porta mais rápido."
flood2 = "A FlOOD ataca 3 vezes seguidas."
maw = "A gananciosa Maw aparece. Ela às vezes aparece no escritório; atire nela quando a boca estiver aberta. Atirar na boca fechada não faz nada."
maw1 = "A Maw se desloca, especialmente quando está de boca aberta."
maw2 = "A Maw fecha a boca com mais frequência."
crave = "A gulosa CRAVE aparece. Ela vai se mover pelas câmeras miando. No quarto miado dela, feche a porta para bloqueá-la."
crave1 = "A CRAVE precisa ser cegada antes de chegar à porta."
crave2 = "A CRAVE agora ataca no quarto OU terceiro miado dela."

adhere = "A luxuriosa Adhere aparece. A Adhere às vezes aparece no centro do seu escritório. Acerte-a duas vezes para fazê-la ir embora."
adhere1 = "A Adhere vai atacar muito mais rápido quando as câmeras estiverem abertas."
adhere2 = "Lidar com a Adhere provocará um ataque da Wanton."
indulgence = "A gulosa Indulgence aparece. Quando a Indulgence aparecer sob o seu cursor com um contador, mova o cursor para a bandeira que surge em algum lugar da tela até completar a cota indicada."
indulgence1 = "A cota da Indulgence será maior."
indulgence2 = "A Indulgence exigirá completar 2 cotas seguidas."
farce = "A preguiçosa Farce aparece. A Farce aparecerá com um som alto de explosão de chamas na câmera marcada em roxo. Quando ela entrar no seu escritório"
farce1 = ""
farce2 = ""

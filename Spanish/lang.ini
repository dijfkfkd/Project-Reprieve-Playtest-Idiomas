gallery25name = "Uriel"
gallery25 = "¡Hola! Es un placer que te interese saber sobre mí. Soy Uriel, uno de los 7 arcángeles sagrados de la corte celestial de Yavé. Desempeño el papel de discípulo de la bondad y la sabiduría. No hagas caso a mi falta de alas; me deshice de ellas para transformarme en un escriba terrenal. Me he pasado los siglos estudiando cada milenio venidero y aquellos que ya quedaron atrás. ¡Fui yo quien te ha estado guiando todo este tiempo! Me alegra comprobar que tu curiosidad está a la altura de la mía."
gallery25devnotes = "Todo quisique se quiere acostar con este tipo, no lo entiendo."

gallery26name = ""
gallery26 = ""
gallery26devnotes = "EN DESARROLLO"


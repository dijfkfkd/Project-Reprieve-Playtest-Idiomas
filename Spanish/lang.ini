[gallery]
gallery0name = "Whim"
gallery0 = "Whim es uno de los demonios más antiguos del Infierno, cuya existencia se remonta al primer acto directo de ira cometido por los vivos. A pesar de su veteranía, está increíblemente dedicada a corromper el mundo con su rabia, particularmente a través de actos de venganza. Está enganchada a esta clase de cosas. Últimamente se ha vuelto muchísimo más irritable porque alguien le arrancó los dientes. Me pregunto por qué."
gallery0devnotes = "A qué santo se me ocurriría ponerle un culo tan grande. Whim fue el PRIMER personaje de Project Reprieve en ser creado. Su diseño artístico, efectos de sonido y código se programaron antes que ningún otro personaje o mecánica. Obviamente, se basa en el arquetipo clásico de diablo: cuernos, dientes afilados y color rojo. Se supone que iba a llevar rabo, pero esa idea se desechó incluso antes de escribir la primera versión de Project Reprieve."

gallery1name = "N"
gallery1 = "Una creación monstruosa de violencia y furia. La manifestación de terribles actos bélicos concebidos por los vivos. Cuando N emergió por primera vez hacia la década de 1930, abrió brecha desde el norte de Rusia por todo el continente europeo, descendiendo al Infierno en los años 60 y dejando un rastro de muertes atroces y sufrimiento. N es incapaz de razonar, ya que toda su existencia es puro dolor. Su cuerpo apenas se mantiene unido a base de fuerza de voluntad y puntos de sutura mientras libra una guerra interna en su interior. Cuentan que si N se parte por la mitad, el mundo llegará a su fin."
gallery1devnotes = "EN DESARROLLO"

gallery2name = "2any"
gallery2 = "Zenatia formaba parte de los vivos, exactamente igual que tú. Sin embargo, vivía consumida por los celos y la envidia, lo que la condujo por una senda de flagelación y amargo rencor hacia cualquiera a quien considerase 'superior'. Al morir, fue condenada en el Infierno a quedar atrapada en un cuerpo de metal y obligada a contemplar a aquellos que, en el mundo terrenal, disfrutan de vidas que ella misma habría podido tener si hubiera sido mejor. Curiosamente, no obstante, al observarte desde dentro, una furia interior fermentó, pudriendo su corazón y su alma hasta que solo quedaron envidia y rabia hacia cualquiera que busque la superación personal. No debería estar aquí, pero cada vez que la devolvemos a su Infierno, se escapa dejando tras de sí una estela de demonios muertos."
gallery2devnotes = "EN DESARROLLO"

gallery3name = "Wanton"
gallery3 = "Te habrás preguntado alguna vez qué voz es esa en lo más hondo de tu mente que te incita a sucumbir al autoplacer. Con toda probabilidad sea Wanton haciendo de las suyas contigo. La manifestación de la lujuria deshonesta y la complacencia propia. Las Wanton tienden a actuar en solitario y a dejar amplios intervalos entre sus apariciones para cumplir con su labor. Las disputas territoriales entre sectores del Infierno dominados por Wanton son siempre un espectáculo bochornoso. Wanton también suele empujarte al abuso de drogas u otros vicios."
gallery3devnotes = "EN DESARROLLO"

gallery4name = "Pompous"
gallery4 = "Pompous ha sido un demonio consentido de la codicia desde su génesis. Pasó sus años formativos consumiendo metales preciosos, principalmente oro, ingiriéndolos en cantidades tales que su piel se pudrió, dejando en su lugar tan solo un esqueleto brillante. El apetito de Pompous jamás ha quedado saciado de verdad. Uno de los colegas demoníacos de Pompous fue de los primeros discípulos de la codicia en introducir la noción del capitalismo. Sin embargo, Pompous corrompió tanto a aquel demonio que se encargó de borrar su nombre de los libros de historia únicamente para apropiarse de la autoría de la idea."
gallery4devnotes = "EN DESARROLLO"

gallery5name = "creep"
gallery5 = "No olvides jamás tus opiniones, pues son herramientas para comprender el mundo y tomar decisiones, no aquello que eres. No debes dudar en descartarlas si dejan de funcionar. Pero creep, una aberración del orgullo, se asegura de que la gente se aferre a sus opiniones con más fuerza que a sus semejantes vivos. Bloqueando su mentalidad a base de barras de hierro y miedo. ¿Notas ese terror a tu espalda? Es creep vigilándote. Exigiendo que seas coherente con tus puntos de vista. Ten cuidado si cambias de parecer, porque creep tiene la mala costumbre de obligar a quienes lo hacen a prestar atención a dicho cambio... por la fuerza."
gallery5devnotes = "EN DESARROLLO"

gallery6name = "RANCOR"
gallery6 = "Ay, pobre y desdichada alma de pecadora. Consumida por un desprecio hacia sí misma peor de lo que ni la mismísima lengua del Diablo podría proferir. A pesar de mi compasión, Yavé dictaminó que el destino de esta pecadora sería la pérdida absoluta de su identidad. Los gritos rasgaron el firmamento mientras su alma era azotada. Abandonada a deambular por las periferias del Infierno, carente siquiera de un rostro con el que llorar su propio luto. Muéstrale compasión si te es posible."
gallery6devnotes = "EN DESARROLLO"

gallery7name = "StitchWork"
gallery7 = "Odio a StitchWork. Es una embustera y una timadora, y su orgullo no conoce límites. Pese a ser la encarnación de la mentira y el engaño, cuenta con una autoconciencia sorprendente. No al nivel de los demonios, los ángeles o los vivos, pero resulta llamativamente consciente a pesar de todo. StitchWork plantó las primeras semillas de la desconfianza en la antigüedad y lleva enturbiando la comunicación de los vivos desde entonces. Quizá por eso posea mucha más consciencia si se compara con otras manifestaciones. En cualquier caso, no te creas ni una palabra de lo que nadie diga en su presencia."
gallery7devnotes = "EN DESARROLLO"

gallery8name = "CONCEIT"
gallery8 = "CONCEIT es una aberración burlona impulsada por el orgullo. Se cree superior a ti, a mí e incluso a Yavé. Todavía no he tenido ocasión de presenciar que alguien dé con el modo de hacerla retroceder en esa postura, puesto que suele zanjar el enfrentamiento con rapidez. Y de manera letal. Pasar el rato en su compañía es caminar por la cuerda floja sobre el abismo de desatar su ego. Más vale no tentar a la bestia. Pero ten cuidado si de buenas a primeras te embarga un sentimiento de superioridad y perfección. Nadie es perfecto. La existencia de CONCEIT exuda un penetrante hedor a orgullo undeserved [inmerecido] en todo su alrededor. Ve con cuidado."
gallery8devnotes = "EN DESARROLLO"

gallery9name = "Qualm"
gallery9 = "Tejida a partir de remordimientos y encadenada al pasado. Impulsada por la envidia, Qualm constituye una manifestación fascinante. Su envidia no nace de los celos hacia los demás, sino de la envidia hacia el pasado y del anhelo de devolverle su antiguo esplendor. Qualm corroe el alma desde dentro, destilando lentamente pensamientos de duda y autosabotaje en las pobres almas que toma como blanco. Con el tiempo, se estancan. Encadenadas de forma idéntica a como lo está Qualm. Tal vez sea discípula de la envidia porque envidia la libertad ajena."
gallery9devnotes = "EN DESARROLLO"

gallery10name = "Reap"
gallery10 = "A pesar de lo que pueda sugerir su aspecto, Reap es un ángel que ha venido para echarte una mano. No a lo grande, sino recordándote simplemente que no debes caer en la pereza. Es más... directo que la mayoría de los ángeles, motivo por el cual le destinaron al Infierno. Desgraciadamente, eso significaba renunciar a su forma angélica, ya que una estancia prolongada en el Infierno arruinaría de manera paulatina un cuerpo tan sensible al pecado como el de un ser celestial. Por consiguiente, adoptó este aspecto más sencillo y accesible. Reap podría hacer lo que le viniera en gana, pero supongo que ya se ha acostumbrado. A lo mejor podrías preguntarle al respecto."
gallery10devnotes = "EN DESARROLLO"

gallery11name = "Caustic"
gallery11 = "Pragmatismo. Un concepto desconocido para la mayoría, pero que define a la perfección a Caustic. Nacidas de la más pura descomposición moral de la pereza. Hacer lo correcto únicamente cuando resulta fácil, y no cuando es lo debido. Las Caustic ponen en la picota a personas de voluntad endeble o problemas de función ejecutiva, infiltrando pensamientos de egoísmo y apatía en sus corazones. Los atajos pueden resultar útiles, pero ojo con abusar de ellos. Caustic deja familias destrozadas y relaciones arruinadas a su paso al descender al Infierno tras su manifestación."
gallery11devnotes = "EN DESARROLLO"

gallery12name = "BLACKENed"
gallery12 = "La ayuda de un amigo siempre es bienvenida, y hay que saber discernir cuándo se precisa. Sin embargo, la dependencia excesiva de los demás arrastra al hombre a la pereza. BLACKENed es un alma con el corazón podrido. Siguió confiando en los otros y dependiendo de ellos a pesar de disponer de todas las oportunidades para salir adelante por sí misma. Incluso siendo perfectamente capaz de hacer todo sin ayuda ajena. Y aun así, no paraba de pedir auxilio o endosar sus responsabilidades a los demás. Se ve forzada a sangrar, incapaz de detenerlo por cuenta propia, mientras el dolor aumenta a medida que su sangre corrosiva quema su piel de piedra. Solo puede mirar cómo toda su cabeza se hunde en residuos ácidos. Qué triste."
gallery12devnotes = "EN DESARROLLO"

gallery13name = "INTENT"
gallery13 = "Una burla. Una aberración de la lujuria engendrada por Él. INTENT se disfraza de ángel con todas sus fuerzas, pero la máscara es imperfecta. Su aureola está rota y carece de alas. INTENT representa la adoración llevada a un extremo impropio. Toda su existencia se consagra a imponer su retorcida moral y devoción sobre los demás. Bajo los hábitos se ocultan decenas de nombres de Yavé esculpidos en los idiomas más variados. Bajo ningún concepto se deben escuchar los sermones de INTENT; se trata de una criatura sumamente irracional y devota, hasta el punto de sufrir un colapso moral, ya que sus creencias basculan en un parpadeo hacia lo que considera la Palabra de Ella."
gallery13devnotes = "EN DESARROLLO"

gallery14name = "Shelter"
gallery14 = "Shelter es un demonio del orgullo esculpido a partir de la vergüenza. Su pánico al juicio es tan hondo que bloquea cualquier crítica o veredicto posible. Es de los escasos demonios con capacidad para crear manifestaciones autónomas, que no son sino las múltiples bocas de las que se vale para susurrar sensaciones de pavor y ansiedad a quienes toma por objetivo. Estas bocas constituyen entidades ajenas a Shelter, pero acatan cada una de sus órdenes. Sin sus bocas alrededor, Shelter le tiene un miedo morrocotudo a cualquier persona y a cualquier cosa."
gallery14devnotes = "EN DESARROLLO"

gallery15name = "OverGrowth"
gallery15 = "Nacida de una negligencia parental prolongada, OverGrowth es una manifestación que ha dejado una estela de podredumbre y profanación que aún no ha descendido por completo al Infierno. El cuerpo real de OverGrowth se extiende a lo largo de miles de kilómetros; la mayor parte reposa en el Infierno, pero fragmentos suyos continúan reptando por la superficie del mundo de los vivos, dejando edificios corrompidos y mascotas hambrientas a su paso. Curiosamente, OverGrowth supone la primera y hasta la fecha única manifestación compuesta de materia vegetal en vez de brotar de energías demoníacas. El cuerpo de OverGrowth continúa bajo el control de fuerzas oscuras, pero me pregunto si su anatomía entera conforma una sola criatura titánica o si se trata de varios especímenes grandes gobernando sectores distintos."
gallery15devnotes = "EN DESARROLLO"

gallery16name = "GRUDGE"
gallery16 = "GRUDGE es una aberración de furia y violencia. Localiza a quienes batallan o caminan solos de noche y los derriba. Su acometida prosigue hasta que la víctima se halla al borde de la muerte, momento en el que le susurra a los oídos pensamientos espantosos de violencia antes de esfumarse en la oscuridad. Lo curioso es que, si la víctima asiente, sus profundos cortes y heridas sanan al instante. Mas si la persona es lo bastante pura o moralmente fuerte como para no doblegarse, los traumatismos persisten y sangran sin tregua. Muy pocos han sobrevivido tras rechazarla."
gallery16devnotes = "EN DESARROLLO"

gallery17name = "Grovel"
gallery17 = "Grovel es el equivalente quiral de BLACKENed. En lugar de incurrir en una dependencia excesiva, era demasiado independiente por su cuenta, hasta el punto de pasar hambre, quedarse en la calle y acabar muriendo de una infección en una herida de las piernas. Profundamente avergonzado al recalar en el Infierno, huyó hacia los arrabales, ocultándose con pieles de la fauna local y rebuscando en los yermos cualquier cosa que le ayudase a redimirse consigo mismo."
gallery17devnotes = "EN DESARROLLO"

gallery18name = "Waste"
gallery18 = "Una aberración putrefacta de la gula. Waste se nutre de los detritos, la basura y la contaminación generados por los vivos; hoy en día, la mayor parte de su anatomía habita el Océano Pacífico, abarcando una superficie aproximada de 620.000 millas cuadradas. Actualmente, Waste se filtra poco a poco desde el Infierno hacia el mundo de los mortales para seguir alimentándose. Penetra de manera habitual en acuíferos y cadenas tróficas, infectándolas con su esencia e incitando a los consumidores a acumular todavía más desperdicios, consumir y generar más residuos todavía."
gallery18devnotes = "EN DESARROLLO"

gallery19name = "glare"
gallery19 = "¿No sabes acaso que mirar fijamente de esa forma es de mala educación? Y encima con semejante intensidad. Déjame en paz. Te lo ruego. Diré lo que sea necesario para que te marches. Por favor, no me hagas daño."
gallery19devnotes = "EN DESARROLLO"


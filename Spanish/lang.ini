[modifiers]
whim = "La irritada Whim hace acto de presencia. Se mueve por las cámaras atacando tu oficina. Aciértale en la CARA cuando aparezca."
whim1 = "Tienes menos tiempo para lidiar con Whim."
whim2 = "Tras golpear a Whim, debes ir a la cámara 1 y darle un fogonazo."
whim3 = "Whim te da más margen para el fogonazo y el golpe, pero se desplaza por las cámaras mucho más rápido."
n = "La irritada N hace acto de presencia. Se mueve por las cámaras atacando tu oficina. Lánzale una piedra A LA CABEZA cuando aparezca."
n1 = "N exige una piedra extra para hacerla retroceder."
n2 = "Cuando N retrocede, provoca un ataque de StitchWork."
n3 = "Dispones de menos tiempo para lidiar con N, y se mueve más rápido por las cámaras."
twoany = "La envidiosa 2any hace acto de presencia. Se mueve por las cámaras atacando tu puerta. Cierra la puerta en sus narices cuando aparezca."
twoany1 = "Debes mantener la puerta firmemente cerrada ante 2any durante un segundo entero."
twoany2 = "2any ataca rápidamente de nuevo tras su primer asalto con un temporizador de muerte más corto, pero se marcha SIEMPRE de inmediato al cerrar la puerta."
twoany3 = "2any llega muchísimo más rápido."
wanton = "La lujuriosa Wanton hace acto de presencia. Se mueve por las cámaras atacando tu oficina. Mueve el cursor rápidamente arriba y abajo sobre ella hasta que se marche."
wanton1 = "Wanton exige muchos más movimientos de agitación arriba y abajo para irse (o da menos tiempo para el golpe si 'sentir algo' está activo)."
wanton2 = "Ahora hay que golpear a Wanton. Espera a que el pecho de Wanton se abra en forma de corazón."
wanton3 = "El ataque de Wanton consta de 2 fases. Primero realiza la agitación con el ratón, lo que abrirá el corazón de Wanton."
pompous = "La codiciosa Pompous hace acto de presencia. Se mueve por las cámaras atacando tu oficina. Contén la respiración manteniendo el cursor sobre ella."
pompous1 = "Pompous se disolverá lentamente tras aparecer."
pompous2 = "Pompous te robará el arma o la piedra si las llevas equipadas y pasas el cursor por encima. Cada objeto robado reduce el tiempo que debes contener la respiración."
pompous3 = "El tiempo para lidiar con Pompous se reduce y necesitas aguantar la respiración sobre ella durante más tiempo."
creep = "La orgullosa creep hace acto de presencia. Está en la cámara 7. Usa el fogonazo de la cámara para restablecer su movimiento."
creep1 = "Cuanto más tiempo pases sin mirar la cámara de creep, más rápido avanzará. Hasta 3 veces más rápido."
creep2 = "El fogonazo ya no reinicia a creep. Simplemente retrocede una fase."
creep3 = "El fogonazo sobre creep acelera ligeramente la infección de glare."
rancor = "La irritada RANCOR hace acto de presencia. Se manifiesta en la cámara 7 o 6. Aparecerá a la izquierda o derecha de tu oficina. Golpéala."
rancor1 = "RANCOR ataca ahora 4 veces seguidas."
rancor2 = "RANCOR se mueve más despacio, pero debe ser cegada en la cámara antes de entrar en la oficina."
rancor3 = "Tienes menos tiempo para lidiar con RANCOR."
stitchwork = "La orgullosa StitchWork hace acto de presencia. Si ves la alucinación de StitchWork en tu pantalla, busca la cámara marcada en marrón y dale un fogonazo."
stitchwork1 = "La alucinación de StitchWork se disolverá lentamente tras el ataque."
stitchwork2 = "StitchWork exige 2 fogonazos y se moverá tras cada uno de ellos."
stitchwork3 = "StitchWork tiene versiones falsas de sí misma en todas las cámaras en las que NO está."
conceit = "La orgullosa CONCEIT hace acto de presencia. A veces aparece en la oficina; contiene la respiración cuando abra el ojo."
conceit1 = "Golpear a CONCEIT ahora solo reinicia su ataque."
conceit2 = "Debes contener la respiración ANTES de que CONCEIT abra la boca."
conceit3 = "CONCEIT ataca más deprisa."
qualm = "La envidiosa Qualm hace acto de presencia. A veces aparece en la oficina; dispárale 3 veces. Se moverá con cada disparo."
qualm1 = "Qualm se mueve ahora de forma constante."
qualm2 = "Dispones de menos tiempo para lidiar con Qualm."
qualm3 = "Dispones de muchísimo menos tiempo para lidiar con Qualm."
reap = "El perezoso Reap hace acto de presencia. Seguirá tu cursor, volviéndose más lento cuanto más cerca estés de él. Mantener el cursor sobre él demasiado tiempo te matará."
reap1 = "Reap se mueve un poco más rápido y traza curvas más cerradas."
reap2 = "Golpear a Reap provocará un ataque de Qualm, Caustic y CONCEIT. Reap no puede ser golpeado si alguno de esos tres está activo."
reap3 = "El tiempo de contacto de Reap volverá lentamente a 0 en vez de reiniciarse a 0 al apartar el cursor."
caustic = "La perezosa Caustic hace acto de presencia. Una señal de aviso parpadeará en la oficina. En cuanto deje de parpadear, lánzale una piedra."
caustic1 = "Caustic hace parpadear el aviso solo dos veces y mata mucho más rápido."
caustic2 = "Caustic se mueve ocasionalmente durante el ataque."
caustic3 = "Caustic hace que BLACKENed sangre más rápido durante el ataque."
blackened = "La perezosa BLACKENed se quedará en tu pasillo sangrando despacio. Haz clic en ella para frenar la hemorragia."
blackened1 = "BLACKENed sangra más deprisa."
blackened2 = "La señal acústica de BLACKENed está desactivada."
blackened3 = "Cuanto más sangra BLACKENed, más se oscurece la oficina."

intent = "El lustroso INTENT hace acto de presencia. Tiene un número en su 'aureola' y contará hasta 7; asegúrate de estar en las cámaras cuando llegue a ese número."
intent1 = "El número de INTENT oscilará ahora entre 7 y 10."
intent2 = "INTENT aparece con más frecuencia."
shelter = "La orgullosa Shelter hace acto de presencia. Se mueve por las cámaras atacando tu oficina. Dispara a las 3 bocas que convoca alrededor de la oficina y luego dispárale a ella."
shelter1 = "Shelter convocará 5 bocas en vez de 3."
shelter2 = "Shelter se mueve más rápido por las cámaras."
overgrowth = "La perezosa OverGrowth hace acto de presencia. Cuando la flor de OverGrowth mire hacia la oficina, encuentra sus 3 lianas en las 3 cámaras marcadas en rosa y dale un fogonazo a esa cámara."
overgrowth1 = "Las lianas de OverGrowth ocuparán tu espacio con mayor rapidez."
overgrowth2 = "OverGrowth ataca ahora todas las cámaras, pero tarda mucho más en matar."
grudge = "La irritada GRUDGE hace acto de presencia. GRUDGE empieza a moverse periódicamente por tu oficina. Golpéala hasta arrancarle todos los dientes. Si llega al otro lado de la oficina, te mata."
grudge1 = "GRUDGE volverá a generar dientes si no lidias con ella con la suficiente rapidez."
grudge2 = "GRUDGE corre más deprisa cuantas menos progresiones haya completado."
grovel = "El envidioso Grovel hace acto de presencia. Recuerda el símbolo del cartel que sostiene Grovel. Cada vez que baje el cartel, deberás emplear el método de defensa correcto contra él (mantén el cursor sobre él si necesitas contener la respiración)."
grovel1 = "Grovel bajará el cartel cada 3 cambios de cámara, dando menos margen para lidiar con él."
grovel2 = "Grovel se moverá después de bajar el cartel."
waste = "El codicioso Waste hace acto de presencia. Waste se filtrará en la oficina por varios puntos en forma de pequeña gota. Golpea las gotitas cuando creen un ojo. Si se acumulan 5 gotas con ojos, Waste te matará."
waste1 = "Las gotas de Waste crearán ojos más rápido tras filtrarse en tu oficina."
waste2 = "Todas las gotas de Waste se acumularán lentamente, una más rápido que las demás, y solo esa creará un ojo antes que las demás."
glare = "La envidiosa glare hace acto de presencia. glare infectará gradualmente las cámaras una a una. Si infecta todas tus cámaras, te matará. Un fogonazo en la cámara la limpia."
glare1 = "Una cámara totalmente infectada por glare solo se limpiará de la infección en el segundo fogonazo, siendo el primero necesario para lidiar con cualquier otro."
glare2 = "La cantidad de cámaras infectadas por glare incrementa la velocidad de creep."

flood = "La codiciosa FlOOD hace acto de presencia. Cuando oigas el sonido del agua corriendo, cierra la puerta con presteza para detenerla."
flood1 = "FlOOD ataca tu puerta más rápido."
flood2 = "FlOOD ataca 3 veces seguidas."
maw = "La codiciosa Maw hace acto de presencia. A veces aparece en la oficina; dispárale cuando tenga la boca abierta. Dispararle con la boca cerrada no sirve de nada."
maw1 = "Maw se desplaza, especialmente cuando tiene la boca abierta."
maw2 = "Maw cierra la boca con mayor frecuencia."
crave = "La codiciosa CRAVE hace acto de presencia. Se moverá por las cámaras maullando. En su cuarto maullido, cierra la puerta para bloquearla."
crave1 = "CRAVE necesita ser cegada antes de llegar a la puerta."
crave2 = "CRAVE ataca ahora en su cuarto O tercer maullido."

adhere = "La lujuriosa Adhere hace acto de presencia. Adhere aparece a veces en el centro de tu oficina. Golpéala dos veces para hacerla marchar."
adhere1 = "Adhere atacará mucho más rápido cuando las cámaras estén abiertas."
adhere2 = "Lidiar con Adhere provocará un ataque de Wanton."
indulgence = "La codiciosa Indulgence hace acto de presencia. Cuando Indulgence aparezca bajo tu cursor con un contador, mueve el cursor hacia la bandera que brota en algún punto de la pantalla hasta completar la cuota indicada."

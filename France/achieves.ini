[source: 11][modifiersdescriptions]
whim = "Whim fait son apparition. Elle se déplace vers votre bureau depuis la caméra 1 ; parez-la lorsqu'elle apparaît."
whim1 = "Le temps accordé pour la parade de Whim est réduit."
whim2 = "Après avoir paré Whim, vous devez aller à la caméra 1 et lui envoyer une décharge."
n = "N fait son apparition. Elle entre dans le bureau depuis la caméra 1 ; lancez-lui une pierre."
n1 = "N exige désormais qu'on lui lance une pierre supplémentaire pour la faire fuir."
twoany = "2any fait son apparition. Elle se déplace depuis la caméra 2 ; fermez la porte lorsque vous l'entendez parler."
twoany1 = "2any ne s'en va pas instantanément ; exige à la place de maintenir la porte fermée pendant une demi-seconde."
twoany2 = "Deux 2any apparaissent désormais."
wanton = "Wanton fait son apparition. Elle se déplace vers votre bureau ; déplacez votre souris verticalement en gardant le curseur sur elle pour la faire partir."
wanton1 = "Wanton exige davantage de mouvements de souris pour partir, et son minuteur de mort est plus long."
wanton2 = "Wanton peut désormais apparaître de n'importe quel côté du bureau."
pompous = "Pompous fait son apparition. Elle se déplace de la caméra 1 vers votre bureau ; immobilisez-vous avec le curseur sur elle jusqu'à ce qu'elle parte."
pompous1 = "Pompous peut maintenant attaquer de n'importe quel côté et disparaît après son apparition."
creep = "creep fait son apparition. Elle se déplace dans la caméra 7 ; donnez-lui une décharge pour la faire reculer d'une phase."
creep1 = "creep se déplace plus vite à mesure que vous passez de temps sans la surveiller."
rancor = "RANCOR fait son apparition. Elle se déplace depuis la caméra 6 ou 7 avant d'apparaître sur le côté du bureau ; parez-la."
rancor1 = "RANCOR attaque 4 fois d'affilée, changeant de côté à chaque fois."
rancor2 = "2 RANCOR apparaissent et attaquent simultanément."
stitchwork = "Stitchwork fait son apparition. Elle apparaîtra aux côtés de sa propre hallucination ; donnez-lui une décharge dans la caméra marquée en marron."
stitchwork1 = "L'hallucination de Stitchwork s'estompe au lancement de son attaque."
stitchwork2 = "Stitchwork exige 2 décharges et se déplace après en avoir reçu une."
conceit = "Conceit fait son apparition. Lorsqu'elle apparaît, immobilisez-vous rapidement dans le bureau dès qu'elle ouvre la bouche."
conceit1 = "Conceit n'accepte pas la parade ; cela ne fait que réinitialiser son attaque."
conceit2 = "Vous devez rester immobile AVANT que Conceit n'ouvre la bouche."
qualm = "Qualm fait son apparition. Elle apparaît périodiquement dans le bureau ; parez-la 3 fois pour la faire partir, en changeant de place à chaque fois."
qualm1 = "Qualm se déplace désormais de façon constante."
qualm2 = "Qualm draine passivement la VITESSE pendant l'assaut, de plus en plus intensément à mesure que l'attaque progresse."
reap = "Reap fait son apparition. Elle suivra le curseur de la souris, vous tuant si on la laisse immobile trop longtemps."
reap1 = "Reap saute désormais vers votre curseur par à-coups au lieu de se déplacer en douceur."
reap2 = "Parer Reap provoque une attaque de Whim, N, RANCOR ou Caustic."
caustic = "Caustic fait son apparition. Un signal d'avertissement retentira dans le bureau ; lancez-lui une pierre lorsqu'elle apparaît."
caustic1 = "Caustic se déplace désormais après chaque éclair d'avertissement."
caustic2 = "Caustic n'affiche l'avertissement que deux fois."
travis = "Travis fait son apparition. De temps en temps, il espionnera par la porte ; fermez-la et allez à la caméra 6 ou 7 pour lui donner une décharge."
travis1 = "Travis attaque désormais plus fréquemment."
travis2 = "Travis provoque une attaque de N après avoir exécuté son coup rapide."
blackened = "Blackened fait son apparition. Elle se déplace dans le couloir de votre bureau. Cliquer dessus la fera reculer."
blackened1 = "Si Blackened atteint 50 % de progression, vous ne pourrez la repousser que jusqu'à ce point."
blackened2 = "Vos clics repoussent Blackened sur une distance plus courte."
dozer = "Dozer fait son apparition. Maintenez le curseur immobile dans le tiers inférieur de l'écran."
dozer1 = "Dozer se réveille plus vite."
dozer2 = "Dozer attaque chaque fois que Whim fait son apparition."
silverroachy = "SilverRoachy fait son apparition. Donnez-lui une décharge dans les caméras ; rester inactif un moment désactivera vos caméras."
silverroachy1 = "SilverRoachy avance désormais à plus grande vitesse."
silverroachy2 = "SilverRoachy est désormais mortelle."
beanie = "Beanie fait son apparition. Elle apparaîtra de façon aléatoire dans le bureau, touchez-la !"
beanieboss = "DANS TOUTE SA SPLENDEUR"
randommodifier = "Active un modificateur aléatoire et octroie le double de bonus de points en échange."


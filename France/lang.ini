[modifiers]
whim = "L'irritée Whim fait son apparition. Elle se déplace à travers les caméras en attaquant votre bureau. Touchez-la au VISAGE lorsqu'elle apparaît."
whim1 = "Vous avez moins de temps pour gérer Whim."
whim2 = "Après avoir frappé Whim, vous devez aller à la caméra 1 et lui envoyer un flash."
whim3 = "Whim vous donne plus de marge pour le flash et le coup, mais elle se déplace à travers les caméras beaucoup plus rapidement."
n = "L'irritée N fait son apparition. Elle se déplace à travers les caméras en attaquant votre bureau. Lancez-lui une pierre À LA TÊTE lorsqu'elle apparaît."
n1 = "N exige une pierre supplémentaire pour la faire reculer."
n2 = "Quand N recule, cela provoque une attaque de StitchWork."
n3 = "Vous disposez de moins de temps pour gérer N, et elle se déplace plus vite à travers les caméras."
twoany = "L'envieuse 2any fait son apparition. Elle se déplace à travers les caméras en attaquant votre porte. Fermez la porte au nez lorsqu'elle apparaît."
twoany1 = "Vous devez maintenir la porte fermée hermétiquement devant 2any pendant une seconde entière."
twoany2 = "2any attaque à nouveau rapidement après son premier assaut avec un minuteur de mort plus court, mais elle s'en va TOUJOURS immédiatement lorsque l'on ferme la porte."
twoany3 = "2any arrive beaucoup plus rapidement."
wanton = "La luxurieuse Wanton fait son apparition. Elle se déplace à travers les caméras en attaquant votre bureau. Agitez rapidement votre curseur de haut en bas sur elle jusqu'à ce qu'elle parte."
wanton1 = "Wanton exige beaucoup plus de mouvements d'agitation de haut en bas pour partir (ou donne moins de temps pour le coup si 'ressentir quelque chose' est actif)."
wanton2 = "Il faut maintenant frapper Wanton. Attendez que la poitrine de Wanton s'ouvre en forme de cœur."
wanton3 = "L'attaque de Wanton se compose de 2 phases. Elle réalise d'abord l'agitation avec la souris, ce qui ouvrira le cœur de Wanton."
pompous = "La cupide Pompous fait son apparition. Elle se déplace à travers les caméras en attaquant votre bureau. Retenez votre respiration en maintenant le curseur sur elle."
pompous1 = "Pompous se dissoudra lentement après son apparition."
pompous2 = "Pompous vous volera votre arme ou votre pierre si vous les avez équipées et que vous passez le curseur dessus. Chaque objet volé réduit le temps pendant lequel vous devez retenir votre respiration."
pompous3 = "Le temps pour gérer Pompous est réduit et vous devez retenir votre respiration sur elle plus longtemps."
creep = "L'orgueilleuse creep fait son apparition. Elle est dans la caméra 7. Utilisez le flash de la caméra pour réinitialiser son déplacement."
creep1 = "Plus vous passez de temps sans regarder la caméra de creep, plus elle avance vite. Jusqu'à 3 fois plus vite."
creep2 = "Le flash ne réinitialise plus creep. Il la fait simplement reculer d'une phase."
creep3 = "Le flash sur creep accélère légèrement l'infection de glare."
rancor = "L'irritée RANCOR fait son apparition. Elle se manifeste dans la caméra 7 ou 6. Elle apparaîtra à gauche ou à droite de votre bureau. Frappez-la."
rancor1 = "RANCOR attaque désormais 4 fois d'affilée."
rancor2 = "RANCOR se déplace plus lentement, mais doit être aveuglée dans la caméra avant d'entrer dans le bureau."
rancor3 = "Vous avez moins de temps pour gérer RANCOR."
stitchwork = "L'orgueilleuse StitchWork fait son apparition. Si vous voyez l'hallucination de StitchWork sur votre écran, cherchez la caméra marquée en marron et envoyez-lui un flash."
stitchwork1 = "L'hallucination de StitchWork se dissoudra lentement après l'attaque."
stitchwork2 = "Stitchwork exige 2 flashs et se déplacera après chacun d'eux."
stitchwork3 = "Stitchwork a de fausses versions d'elle-même dans toutes les caméras où elle N'EST PAS."
conceit = "L'orgueilleuse CONCEIT fait son apparition. Elle apparaît parfois dans le bureau ; retenez votre respiration lorsqu'elle ouvre l'œil."
conceit1 = "Frapper CONCEIT ne fait plus que réinitialiser son attaque."
conceit2 = "Vous devez retenir votre respiration AVANT que CONCEIT n'ouvre la bouche."
conceit3 = "CONCEIT attaque plus rapidement."
qualm = "L'envieuse Qualm fait son apparition. Elle apparaît parfois dans le bureau ; tirez-lui dessus 3 fois. Elle se déplacera à chaque tir."
qualm1 = "Qualm se déplace désormais de façon constante."
qualm2 = "Vous disposez de moins de temps pour gérer Qualm."
qualm3 = "Vous disposez de beaucoup moins de temps pour gérer Qualm."
reap = "Le paresseux Reap fait son apparition. Il suivra votre curseur, devenant plus lent à mesure que vous en êtes proche. Maintenir le curseur sur lui trop longtemps vous tuera."
reap1 = "Reap se déplace un peu plus vite et trace des courbes plus serrées."
reap2 = "Frapper Reap provoquera une attaque de Qualm, Caustic et CONCEIT. Reap ne peut pas être frappé si l'un de ces trois-là est actif."
reap3 = "Le temps de contact de Reap reviendra lentement à 0 au lieu de se réinitialiser à 0 lorsque l'on écarte le curseur."
caustic = "La paresseuse Caustic fait son apparition. Un signal d'avertissement clignotera dans le bureau. Dès qu'il s'arrête de clignoter, lancez-lui une pierre."
caustic1 = "Caustic fait clignoter l'avertissement seulement deux fois et tue beaucoup plus vite."
caustic2 = "Caustic se déplace occasionnellement pendant l'attaque."
caustic3 = "Caustic fait saigner BLACKENed plus vite pendant l'attaque."
blackened = "La paresseuse BLACKENed restera dans votre couloir à saigner lentement. Cliquez dessus pour ralentir l'hémorragie."
blackened1 = "BLACKENed saigne plus vite."
blackened2 = "Le signal sonore de BLACKENed est désactivé."
blackened3 = "Plus BLACKENed saigne, plus le bureau s'assombrit."

intent = "L'étincelant INTENT fait son apparition. Il a un nombre sur son 'auréole' et comptera jusqu'à 7 ; assurez-vous d'être dans les caméras lorsqu'il atteindra ce nombre."
intent1 = "Le nombre d'INTENT oscille désormais entre 7 et 10."
intent2 = "INTENT apparaît plus fréquemment."
shelter = "L'orgueilleuse Shelter fait son apparition. Elle se déplace à travers les caméras en attaquant votre bureau. Tirez sur les 3 bouches qu'elle invoque autour du bureau puis tirez sur elle."
shelter1 = "Shelter invoquera 5 bouches au lieu de 3."
shelter2 = "Shelter se déplace plus vite à travers les caméras."
overgrowth = "La paresseuse OverGrowth fait son apparition. Lorsque la fleur d'OverGrowth regarde vers le bureau, trouvez ses 3 lianes dans les 3 caméras marquées en rose et envoyez un flash dans cette caméra."
overgrowth1 = "Les lianes d'OverGrowth envahiront votre espace plus rapidement."
overgrowth2 = "OverGrowth attaque désormais toutes les caméras, mais met beaucoup plus de temps à tuer."
grudge = "L'irritée GRUDGE fait son apparition. GRUDGE commence à se déplacer périodiquement dans votre bureau. Frappez-la jusqu'à lui arracher toutes les dents. Si elle atteint l'autre côté du bureau, elle vous tue."
grudge1 = "GRUDGE régénérera des dents si vous ne la gérez pas assez vite."
grudge2 = "GRUDGE court plus vite à mesure qu'elle a complété de progressions."
grovel = "L'envieux Grovel fait son apparition. Retenez le symbole du panneau que tient Grovel. Chaque fois qu'il abaisse le panneau, vous devez employer la méthode de défense correcte contre lui (maintenez le curseur sur lui si vous devez retenir votre respiration)."
grovel1 = "Grovel abaissera le panneau tous les 3 changements de caméra, laissant moins de marge pour le gérer."
grovel2 = "Grovel se déplacera après avoir abaissé le panneau."
waste = "Le cupide Waste fait son apparition. Waste s'infiltrera dans le bureau par divers points sous forme d'une petite goutte. Frappez les gouttelettes lorsqu'elles créent un œil. Si 5 gouttes avec des yeux s'accumulent, Waste vous tuera."
waste1 = "Les gouttes de Waste créeront des yeux plus rapidement après s'être infiltrées dans votre bureau."
waste2 = "Toutes les gouttes de Waste s'accumuleront lentement, l'une plus rapidement que les autres, et seule celle-là créera un œil avant les autres."
glare = "L'envieuse glare fait son apparition. glare infectera progressivement les caméras une par une. Si elle infecte toutes vos caméras, elle vous tuera. Un flash dans la caméra la nettoie."
glare1 = "Une caméra totalement infectée par glare ne sera nettoyée de l'infection qu'au second flash, le premier étant nécessaire pour gérer tout le reste."
glare2 = "La quantité de caméras infectées par glare augmente la vitesse de creep."

flood = "La cupide FlOOD fait son apparition. Lorsque vous entendez le bruit de l'eau qui coule, fermez la porte promptement pour l'arrêter."
flood1 = "FlOOD attaque votre porte plus rapidement."
flood2 = "FlOOD attaque 3 fois d'affilée."
maw = "La cupide Maw fait son apparition. Elle apparaît parfois dans le bureau ; tirez-lui dessus lorsque sa bouche est ouverte. Tirer avec la bouche fermée ne sert à rien."
maw1 = "Maw se déplace, particulièrement lorsque sa bouche est ouverte."
maw2 = "Maw ferme la bouche plus fréquemment."
crave = "La cupide CRAVE fait son apparition. Elle se déplacera à travers les caméras en miaulant. À son quatrième miaulement, fermez la porte pour la bloquer."
crave1 = "CRAVE doit être aveuglée avant d'arriver à la porte."
crave2 = "CRAVE attaque désormais à son quatrième OU troisième miaulement."

adhere = "La luxurieuse Adhere fait son apparition. Adhere apparaît parfois au centre de votre bureau. Frappez-la deux fois pour la faire partir."
adhere1 = "Adhere attaquera beaucoup plus vite lorsque les caméras sont ouvertes."
adhere2 = "Gérer Adhere provoquera une attaque de Wanton."
indulgence = "La cupide Indulgence fait son apparition. Lorsque Indulgence apparaît sous votre curseur avec un compteur, déplacez le curseur vers le drapeau qui jaillit quelque part sur l'écran jusqu'à compléter le quota indiqué."
indulgence1 = "Le quota d'Indulgence sera plus élevé."
indulgence2 = "Indulgence exigera d'accomplir 2 quotas d'affilée."

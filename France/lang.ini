ambient1 = "Ne soyez pas pressé."
ambient2 = "Réfléchissez-y calmement."
ambient3 = "Saviez-vous que vous n'affrontez pas seulement des démons ? Aussi des âmes maudites, des aberrations et des manifestations !"
ambient4 = "Inutile de courir."
ambient5 = "Si vous êtes dans de beaux draps, réfléchissez aux ennemis qui doivent être votre priorité absolue !"

purchase1 = "En espérant que cela vous aide !"

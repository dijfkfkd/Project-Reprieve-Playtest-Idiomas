[gallery]
gallery0name = "Whim"
gallery0 = "Whim est l'un des démons les plus anciens de l'Enfer, dont l'existence remonte au tout premier acte direct de colère commis par les vivants. Malgré son ancienneté, elle est incroyablement dédiée à corrompre le monde avec sa rage, particulièrement à travers des actes de vengeance. Elle est accro à ce genre de choses. Dernièrement, elle est devenue infiniment plus irritable parce que quelqu'un lui a arraché les dents. Je me demande bien pourquoi."
gallery0devnotes = "Quelle idée de saint j'ai eue de lui mettre un cul pareil. Whim a été le PREMIER personnage de Project Reprieve à être créé. Son design artistique, ses effets sonore et son code ont été programmés avant n'importe quel autre personnage ou mécanique. Évidemment, elle se base sur l'archétype classique du diable : cornes, dents acérées et couleur rouge. Elle était censée avoir une queue, mais cette idée a été rejetée avant même d'écrire la première version de Project Reprieve."

gallery1name = "N"
gallery1 = "Une création monstrueuse de violence et de furie. La manifestation de terribles actes belliqueux conçus par les vivants. Lorsque N a émergé pour la première fois vers les années 1930, elle a ouvert une brèche depuis le nord de la Russie à travers tout le continent européen, descendant en Enfer dans les années 60 et laissant un sillage de morts atroces et de souffrance. N est incapable de raisonner, toute son existence n'étant que pure douleur. Son corps tient à peine ensemble à coups de volonté et de points de suture tandis qu'elle livre une guerre intestine en elle-même. On raconte que si N se fend en deux, le monde touchera à sa fin."
gallery1devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery2name = "2any"
gallery2 = "Zenatia faisait partie des vivants, exactement comme vous. Cependant, elle vivait consumée par la jalousie et l'envie, ce qui l'a conduite sur un chemin de flagellation et d'amère rancœur envers quiconque qu'elle considérait comme 'supérieur'. En mourant, elle fut condamnée en Enfer à rester piégée dans un corps de métal et forcée de contempler ceux qui, dans le monde terrestre, profitent de vies qu'elle-même aurait pu avoir si elle avait été meilleure. Curieusement, pourtant, en vous observant de l'intérieur, une furie intérieure a fermenté, pourrissant son cœur et son âme jusqu'à ce qu'il ne reste que de l'envie et de la rage envers quiconque cherche à s'améliorer soi-même. Elle ne devrait pas être ici, mais chaque fois qu'on la renvoie dans son Enfer, elle s'échappe en laissant derrière elle un sillage de démons morts."
gallery2devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery3name = "Wanton"
gallery3 = "Vous vous êtes sûrement demandé quelle est cette voix tout au fond de votre esprit qui vous incite à succomber au plaisir solitaire. Il y a fort à parier que ce soit Wanton qui fait des siennes avec vous. La manifestation de la luxure malhonnête et de la complaisance envers soi-même. Les Wanton ont tendance à agir en solitaire et à laisser de larges intervalles entre leurs apparitions pour accomplir leur tâche. Les querelles territoriales entre secteurs de l'Enfer dominés par Wanton sont toujours un spectacle honteux. Wanton vous pousse aussi généralement à l'abus de drogues ou d'autres vices."
gallery3devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery4name = "Pompous"
gallery4 = "Pompous a été un démon gâté de la convoitise depuis sa genèse. Elle a passé ses années formatrices à consumer des métaux précieux, principalement de l'or, en les ingérant en des quantités telles que sa peau a pourri, ne laissant à la place qu'un squelette scintillant. L'appétit de Pompous n'a jamais été véritablement rassasié. L'un des collègues démoniaques de Pompous a été l'un des premiers disciples de la convoitise à introduire la notion du capitalisme. Cependant, Pompous a tellement corrompu ce démon qu'elle s'est chargée d'effacer son nom des livres d'histoire uniquement pour s'approprier la paternité de l'idée."
gallery4devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery5name = "creep"
gallery5 = "N'oubliez jamais vos opinions, car ce sont des outils pour comprendre le monde et prendre des décisions, et non ce que vous êtes. Vous ne devez pas hésiter à les rejeter si elles cessent de fonctionner. Mais creep, une aberration de l'orgueil, veille à ce que les gens s'accrochent à leurs opinions plus fort qu'à leurs semblables vivants. Bloquant leur mentalité à coups de barres de fer et de peur. Vous sentez cette terreur dans votre dos ? C'est creep qui vous surveille. Exigeant que vous soyez cohérent avec vos points de vue. Faites attention si vous changez d'avis, car creep a la mauvaise habitude de forcer ceux qui le font à prêter attention à ce changement... par la force."
gallery5devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery6name = "RANCOR"
gallery6 = "Ah, pauvre et misérable âme de pécheresse. Consumée par un mépris envers elle-même pire que ce que la langue même du Diable pourrait proférer. Malgré ma compassion, Yahvé a décrété que le destin de cette pécheresse serait la perte absolue de son identité. Des cris ont déchiré le firmament tandis que son âme était fustigée. Abandonnée à errer dans les périphéries de l'Enfer, dépourvue même d'un visage avec lequel pleurer son propre deuil. Montrez-lui de la compassion si cela vous est possible."
gallery6devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery7name = "StitchWork"
gallery7 = "Je déteste StitchWork. C'est une menteuse et une arnaqueuse, et son orgueil ne connaît pas de limites. Bien qu'elle soit l'incarnation du mensonge et de la tromperie, elle possède une conscience d'elle-même surprenante. Pas au niveau des démons, des anges ou des vivants, mais elle s'avère de manière frappante consciente malgré tout. StitchWork a planté les premières graines de la méfiance dans l'Antiquité et ne cesse de troubler la communication des vivants depuis lors. C'est peut-être pour cela qu'elle possède beaucoup plus de conscience si on la compare à d'autres manifestations. Quoi qu'il en soit, ne croyez pas un seul mot de ce que quiconque dit en sa présence."
gallery7devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery8name = "CONCEIT"
gallery8 = "CONCEIT est une aberration moqueuse poussée par l'orgueil. Elle se croit supérieure à vous, à moi et même à Yahvé. Je n'ai pas encore eu l'occasion de voir quelqu'un trouver le moyen de la faire reculer sur cette position, puisqu'elle règle généralement l'affrontement rapidement. Et de manière létale. Passer du temps en sa compagnie, c'est marcher sur un fil au-dessus de l'abîme du déclenchement de son ego. Mieux vaut ne pas tenter le diable. Mais faites attention si, à l'improviste, un sentiment de supériorité et de perfection vous envahit. Personne n'est parfait. L'existence de CONCEIT exude une odeur pénétrante d'orgueil inmérité [inmérité] tout autour d'elle. Allez-y avec précaution."
gallery8devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery9name = "Qualm"
gallery9 = "Tissée à partir de remords et enchaînée au passé. Poussée par l'envie, Qualm constitue une manifestation fascinante. Son envie ne naît pas de la jalousie envers les autres, mais de l'envie du passé et de l'ardent désir de lui rendre son ancienne splendeur. Qualm ronge l'âme de l'intérieur, distillant lentement des pensées de doute et d'autosabotage dans les pauvres âmes qu'elle prend pour cible. Avec le temps, elles stagnent. Enchaînées de façon identique à celle dont Qualm l'est. C'est peut-être une disciple de l'envie parce qu'elle envie la liberté des autres."
gallery9devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery10name = "Reap"
gallery10 = "Malgré ce que son apparence peut suggérer, Reap est un ange qui est venu vous donner un coup de main. Pas en grand, mais en vous rappelant simplement de ne pas tomber dans la paresse. Il est plus... direct que la plupart des anges, raison pour laquelle il a été affecté en Enfer. Malheureusement, cela signifiait renoncer à sa forme angélique, car un séjour prolongé en Enfer ruinerait peu à peu un corps aussi sensible au péché que celui d'un être céleste. Par conséquent, il a adopté cet aspect plus simple et accessible. Reap pourrait faire ce que bon lui semble, mais je suppose qu'il s'y est habitué. Vous pourriez peut-être lui poser la question."
gallery10devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery11name = "Caustic"
gallery11 = "Le pragmatisme. Un concept inconnu pour la plupart, mais qui définit à la perfection Caustic. Nées de la plus pure décomposition morale de la paresse. Faire ce qui est juste uniquement lorsque c'est facile, et non lorsque c'est nécessaire. Les Caustic mettent au pilori des personnes à la volonté fragile ou ayant des problèmes de fonction exécutive, infiltrant des pensées d'égoïsme et d'apathie dans leurs cœurs. Les raccourcis peuvent être utiles, mais attention à en abuser. Caustic laisse des familles brisées et des ruines relationnelles dans son sillage en descendant en Enfer après sa manifestation."
gallery11devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery12name = "BLACKENed"
gallery12 = "L'aide d'un ami est toujours la bienvenue, et il faut savoir discerner quand elle est nécessaire. Cependant, la dépendance excessive envers les autres entraîne l'homme dans la paresse. BLACKENed est une âme au cœur pourri. Elle a continué à faire confiance aux autres et à dépendre d'eux malgré toutes les opportunités d'aller de l'avant par elle-même. Même en étant parfaitement capable de tout faire sans aide extérieure. Et malgré tout, elle n'arrêtait pas de demander du secours ou de refiler ses responsabilités aux autres. Elle est forcée de saigner, incapable de l'arrêter par ses propres moyens, tandis que la douleur augmente à mesure que son sang corrosif brûle sa peau de pierre. Elle peut seulement regarder toute sa tête s'enfoncer dans des résidus acides. Quel tristesse."
gallery12devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery13name = "INTENT"
gallery13 = "Une parodie. Une aberration de la luxure engendrée par Lui. INTENT se déguise en ange de toutes ses forces, mais le masque est imparfait. Son auréole est brisée et il n'a pas d'ailes. INTENT représente l'adoration poussée à un extrême inapproprié. Toute son existence est consacrée à imposer sa morale et sa dévotion tordues sur les autres. Sous ses habits se cachent des dizaines de noms de Yahvé sculptés dans les langues les plus variées. En aucun cas il ne faut écouter les sermons d'INTENT ; il s'agit d'une créature extrêmement irrationnelle et dévote, au point de subir un effondrement moral, puisque ses croyances basculent en un clin d'œil vers ce qu'elle considère comme la Parole d'Elle."
gallery13devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery14name = "Shelter"
gallery14 = "Shelter est un démon de l'orgueil sculpté à partir de la honte. Sa panique face au jugement est si profonde qu'elle bloque toute critique ou verdict possible. C'est l'un des rares démons capables de créer des manifestations autonomes, qui ne sont autres que les multiples bouches dont il se sert pour murmurer des sensations de peur et d'anxiété à ceux qu'il prend pour cible. Ces bouches constituent des entités extérieures à Shelter, mais elles obéissent à chacun de ses ordres. Sans ses bouches autour de lui, Shelter a une trouille bleue de n'importe qui et de n'importe quoi."
gallery14devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery15name = "OverGrowth"
gallery15 = "Née d'une négligence parentale prolongée, OverGrowth est une manifestation qui a laissé un sillage de pourriture et de profanation qui n'est pas encore redescendu entièrement en Enfer. Le corps réel d'OverGrowth s'étend sur des milliers de kilomètres ; la majeure partie repose en Enfer, mais des fragments de celle-ci continuent de ramper à la surface du monde des vivants, laissant des bâtiments corrompus et des animaux domestiques affamés sur son passage. Curieusement, OverGrowth représente la première et jusqu'à présent unique manifestation composée de matière végétale au lieu de jaillir d'énergies démoniaques. Le corps d'OverGrowth reste sous le contrôle de forces obscures, mais je me demande si son anatomie entière forme une seule créature titanique ou s'il s'agit de plusieurs grands spécimens régissant des secteurs distincts."
gallery15devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery16name = "GRUDGE"
gallery16 = "GRUDGE est une aberration de furie et de violence. Elle repère ceux qui bataillent ou marchent seuls la nuit et les abat. Son assaut se poursuit jusqu'à ce que la victime se trouve au bord de la mort, moment où elle lui murmure à l'oreille des pensées épouvantables de violence avant de s'évanouir dans l'obscurité. Le plus curieux est que, si la victime acquiesce, ses profondes coupures et blessures guérissent instantanément. Mais si la personne est suffisamment pure ou moralement forte pour ne pas plier, les traumatismes persistent et saignent sans répit. Très peu ont survécu après l'avoir rejetée."
gallery16devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery17name = "Grovel"
gallery17 = "Grovel est l'équivalent chiral de BLACKENed. Au lieu de commettre une dépendance excessive, il était beaucoup trop indépendant par lui-même, au point de mourir de faim, de se retrouver à la rue et de finir par mourir d'une infection sur une blessure aux jambes. Profondément honteux en atterrissant en Enfer, il a fui vers les faubourgs, se cachant avec des peaux de la faune locale et fouillant les terres désolées pour trouver quoi que ce soit qui l'aide à se racheter auprès de lui-même."
gallery17devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery18name = "Waste"
gallery18 = "Une aberration putréfiée de la gloutonnerie. Waste se nourrit des détritus, des ordures et de la pollution générés par les vivants ; de nos jours, la plus grande partie de son anatomie habite l'Océan Pacifique, s'étendant sur une superficie approximative de 620 000 miles carrés. Actuellement, Waste s'infiltre peu à peu depuis l'Enfer vers le monde des mortels pour continuer à se nourrir. Elle pénètre régulièrement dans les aquifères et les chaînes alimentaires, les infectant par son essence et incitant les consommateurs à accumuler encore plus de déchets, à consommer et à générer encore plus de résidus."
gallery18devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery19name = "glare"
gallery19 = "Ne savez-vous donc pas que fixer ainsi les gens est impoli ? Et par-dessus le marché avec une telle intensité. Laissez-moi tranquille. Je vous en supplie. Je dirai tout ce qu'il faudra pour que vous partiez. S'il vous plaît, ne me faites pas de mal."
gallery19devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery20name = "FlOOD"
gallery20 = ""
gallery20devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery21name = "Maw"
gallery21 = ""
gallery21devnotes = "EN COURS DE DÉVELOPPEMENT"


spankbill = "SpankBill fait son apparition. Une fois sur deux lorsque vous fermez les caméras, SpankBill se place dans le couloir central avant de courir vers la gauche ou la droite. Donnez-leur un flash dans la caméra 7 s'ils courent vers la gauche, ou dans la caméra 6 s'ils courent vers la droite."

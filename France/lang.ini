gallery23name = "Adhere"
gallery23 = "CRÉÉ EN COLLABORATION AVEC VINNYGRAVE"
gallery23devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery24name = "Indulgence"
gallery24 = "CRÉÉ EN COLLABORATION AVEC BANANANATER"
gallery24devnotes = "EN COURS DE DÉVELOPPEMENT"

gallery25name = "Uriel"
gallery25 = "Bonjour ! C'est un plaisir que vous vous intéressiez à moi. Je suis Uriel, l'un des 7 archanges sacrés de la cour céleste de Yahvé. J'exerce le rôle de disciple de la bonté et de la sagesse. Ne prêtez pas attention à mon manque d'ailes ; je m'en suis débarrassé pour me transformer en scribe terrestre. J'ai passé les siècles à étudier chaque millénaire à venir et ceux qui sont déjà derrière nous. C'est moi qui vous ai guidé tout ce temps ! Je suis heureux de constater que votre curiosité est à la hauteur de la mienne."
gallery25devnotes = "Tout le monde veut se coucher avec ce type, je ne comprends pas."

gallery26name = ""
gallery26 = ""
gallery26devnotes = "EN COURS DE DÉVELOPPEMENT"

